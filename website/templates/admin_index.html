<a href="/1/logout"
   style="display:inline-block;margin-bottom:10px;
          padding:6px 12px;background:#e74c3c;
          color:white;border-radius:6px;text-decoration:none;">
    退出登录
</a>

<h2>米家扫码登录</h2>
<div id="qr_box">加载中...</div>

<script>
async function loadQR() {
    const res = await fetch("/1/api/mijia_qr")
    const data = await res.json()
    document.getElementById("qr_box").innerHTML =
        `<img src="${data.qr}" style="width:260px">`
    pollStatus(data.token)
}

async function pollStatus(token) {
    const timer = setInterval(async () => {
        const res = await fetch(`/1/api/mijia_status?token=${encodeURIComponent(token)}`)
        const data = await res.json()

        if (data.status === "ok") {
            clearInterval(timer)
            alert("登录成功！")
            location.reload()
        }
    }, 3000)
}

loadQR()
</script>
