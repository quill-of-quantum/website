<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备管理</title><link rel="stylesheet" href="/static/css/base.css"><style>
.device-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.device-card{border:1px solid #e5e7eb;border-radius:10px;padding:14px;background:#fff;cursor:pointer}.device-card:hover{border-color:#93c5fd}.muted{color:#6b7280;font-size:13px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;background:#f3f4f6}.online{background:#dcfce7;color:#166534}.offline{background:#f3f4f6;color:#4b5563}.pending{background:#fef3c7;color:#92400e}.missing{background:#fee2e2;color:#991b1b}.connected{background:#dcfce7;color:#166534}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.detail{display:none}.detail-panel,.config-panel{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-top:14px}.config-sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:14px 0}.config-panel h3{margin:0 0 10px}.config-grid{display:grid;gap:10px}.config-field{background:#f8fafc;border-radius:8px;padding:10px}.config-field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.component-grid,.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.component,.data-item{background:#f8fafc;border-radius:8px;padding:10px}.data-key{font-size:12px;color:#6b7280}.data-value{margin-top:4px;overflow-wrap:anywhere}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.photo-item{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;background:#f8fafc}.photo-item img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e5e7eb}.photo-meta{padding:8px;font-size:12px;color:#6b7280}
</style></head><body><div class="page"><div class="container"><div class="page-header"><h1>设备管理</h1></div>
<div class="toolbar"><a class="btn" href="/1/">返回管理面板</a><a class="btn" href="/1/devices/database">管理数据库</a><button class="btn btn-primary" id="pair">添加新设备</button><button class="btn" id="stop" hidden>停止等待</button><span id="pair-status" class="muted"></span><span id="ble-gateway-status" class="pill offline">BLE Gateway 检查中</span></div>
<div class="card"><h2 class="card-title">已绑定设备</h2><div id="devices" class="device-grid">加载中...</div></div>
<div class="card" id="pending-card" hidden><h2 class="card-title">待批准设备</h2><div id="pending" class="device-grid"></div></div>
<div class="card detail" id="detail"><div class="toolbar" style="justify-content:space-between"><h2 class="card-title" id="detail-title"></h2><button class="btn btn-danger" type="button" id="delete-device">删除设备</button></div><div id="detail-summary"></div><section class="detail-panel"><h3>名称与身份</h3><form id="name-form"><div class="toolbar"><input class="input" style="max-width:420px" id="device-name" maxlength="120" required placeholder="输入设备名称"><button class="btn btn-primary" type="submit">保存名称</button><span id="name-status" class="muted"></span></div></form></section><section class="detail-panel"><h3>硬件状态</h3><div id="components" class="component-grid"></div></section><section class="detail-panel"><h3>功能配置</h3><form id="config-form"><div id="config-fields" class="config-sections"></div><div class="toolbar"><button class="btn btn-primary" type="submit">保存全部配置</button><span id="config-status" class="muted"></span></div></form></section><section class="detail-panel" id="photo-section" hidden><h3>最近照片</h3><div id="photos" class="photo-grid"></div></section><section class="detail-panel"><h3>最近一次设备状态</h3><div id="last-status" class="data-grid"></div></section><section class="detail-panel"><h3>最近一次数据</h3><div id="last-data" class="data-grid"></div></section></div>
</div></div><script src="/static/js/auth.js"></script><script>
let devices=[],selectedId=null,configDirty=false,nameDirty=false,loadedPhotoMarker=null;
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const api=async(url,options={})=>{const response=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败');return data};
const fmt=time=>time?new Date(Number(time)*1000).toLocaleString():'-';
function deviceCard(device,pending=false){const state=pending?'待批准':device.online?'在线':'离线';const css=pending?'pending':device.online?'online':'offline';return `<div class="device-card" onclick="openDevice('${esc(device.device_id)}')"><div><strong>${esc(device.name||device.device_id)}</strong> <span class="pill ${css}">${state}</span></div><div class="muted">${esc(device.config_schema?.label||device.device_type)} · ${esc(device.communication||'-')}</div><div class="muted">最后沟通：${esc(fmt(device.last_seen_at))}（${esc(device.last_contact_kind||'-')}）</div><div class="muted">固件：${esc(device.firmware||'-')} · IP：${esc(device.last_ip||'-')}</div>${pending?`<div class="toolbar" style="margin-top:8px"><button class="btn btn-primary" onclick="event.stopPropagation();approveDevice('${esc(device.device_id)}')">批准</button><button class="btn btn-danger" onclick="event.stopPropagation();deleteDevice('${esc(device.device_id)}',true)">删除请求</button></div>`:''}</div>`}
function applySnapshot(data){devices=data.devices||[];const approved=devices.filter(item=>item.status==='approved');const pending=devices.filter(item=>item.status==='pending');document.getElementById('devices').innerHTML=approved.map(item=>deviceCard(item)).join('')||'<span class="muted">暂无已绑定设备</span>';document.getElementById('pending-card').hidden=!pending.length;document.getElementById('pending').innerHTML=pending.map(item=>deviceCard(item,true)).join('');const pairing=data.pairing||{};document.getElementById('pair-status').textContent=pairing.enabled?'正在等待新设备请求（实时连接）':'设备状态实时连接中';document.getElementById('pair').hidden=!!pairing.enabled;document.getElementById('stop').hidden=!pairing.enabled;const gateway=data.ble_gateway||{};const badge=document.getElementById('ble-gateway-status');badge.className=`pill ${gateway.running&&gateway.scanning?'connected':'missing'}`;badge.textContent=gateway.running&&gateway.scanning?`BLE Gateway 正在扫描${gateway.active_connections?`（${gateway.active_connections} 个连接）`:''}`:`BLE Gateway 未运行${gateway.last_error?`：${gateway.last_error}`:''}`;if(selectedId){const still=devices.find(item=>item.device_id===selectedId);if(still)renderDetail(still,!configDirty);else closeDetail()}}
async function loadDevices(){applySnapshot(await api('/1/api/devices'))}
function startDeviceStream(){const source=new EventSource('/1/api/devices/stream');source.onmessage=event=>{try{applySnapshot(JSON.parse(event.data))}catch(error){console.error('设备状态解析失败',error)}};source.onerror=()=>{document.getElementById('pair-status').textContent='实时连接正在重连…'}}
const sectionLabels={schedule:'工作周期',sensor:'温湿度传感器',camera:'OV5640 摄像头',network:'连接与低功耗',other:'其他配置'};const componentLabels={temperature_humidity:'温湿度传感器',camera:'OV5640 摄像头',sensor:'传感器'};
function componentInfo(device,key){const statusVersion=Number(device.last_status?.config_version);if(!Number.isFinite(statusVersion)||statusVersion!==Number(device.config_version))return {text:'等待新配置检测',css:'pending',stale:true};const value=device.last_status?.components?.[key];if(!value)return {text:'未报告',css:'offline'};const available=value.available??value.present;if(value.enabled===false)return {text:'已关闭',css:'offline'};if(available===false)return {text:'无设备',css:'missing'};if(available===true&&value.code&&value.code!=='ok')return {text:'异常',css:'pending'};if(available===true)return {text:'已连接',css:'connected'};return {text:'检测中',css:'pending'}}
function fieldHtml(field,value,device){const id=`cfg-${field.key}`;const state=field.component?componentInfo(device,field.component):null;const badge=state?` <span class="pill ${state.css}">${state.text}</span>`:'';if(field.type==='boolean')return `<div class="config-field"><label><input id="${id}" data-key="${esc(field.key)}" data-type="boolean" type="checkbox" ${value?'checked':''}> ${esc(field.label)}${badge}</label></div>`;if(field.type==='select'){return `<div class="config-field"><label for="${id}">${esc(field.label)}${badge}</label><select class="input" id="${id}" data-key="${esc(field.key)}" data-type="select">${(field.options||[]).map(option=>`<option value="${esc(option.value)}" ${option.value===value?'selected':''}>${esc(option.label)}</option>`).join('')}</select></div>`}return `<div class="config-field"><label for="${id}">${esc(field.label)}${field.unit?`（${esc(field.unit)}）`:''}${badge}</label><input class="input" id="${id}" data-key="${esc(field.key)}" data-type="${esc(field.type)}" type="number" value="${esc(value)}" ${field.min!==undefined?`min="${field.min}"`:''} ${field.max!==undefined?`max="${field.max}"`:''} step="${field.step||1}"></div>`}
function configHtml(device){const groups={};(device.config_schema?.fields||[]).forEach(field=>{const section=field.section||'other';(groups[section]??=[]).push(field)});return Object.entries(groups).map(([section,fields])=>`<section class="config-panel"><h3>${esc(sectionLabels[section]||section)}</h3><div class="config-grid">${fields.map(field=>fieldHtml(field,device.config?.[field.key],device)).join('')}</div></section>`).join('')}
function componentHtml(device){const expected=[...new Set((device.config_schema?.fields||[]).map(field=>field.component).filter(Boolean))];return expected.map(key=>{const state=componentInfo(device,key);const raw=state.stale?{}:(device.last_status?.components?.[key]||{});return `<div class="component"><strong>${esc(componentLabels[key]||key)}</strong> <span class="pill ${state.css}">${state.text}</span><div class="muted">${esc(raw.model||raw.sensor||raw.code||(state.stale?'设备需要按当前版本重新检测':'等待设备状态上报'))}</div></div>`}).join('')||'<span class="muted">此设备没有声明可检测组件</span>'}
function dataGrid(value){if(!value||typeof value!=='object')return '<span class="muted">暂无数据</span>';return Object.entries(value).map(([key,item])=>`<div class="data-item"><div class="data-key">${esc(key)}</div><div class="data-value">${esc(typeof item==='object'?JSON.stringify(item):item)}</div></div>`).join('')}
async function loadPhotos(device){const section=document.getElementById('photo-section');const hasCamera=(device.capabilities||[]).includes('camera')||(device.config_schema?.fields||[]).some(field=>field.key==='photo_enabled')||!!device.last_photo;section.hidden=!hasCamera;if(!hasCamera)return;document.getElementById('photos').innerHTML='<span class="muted">加载中...</span>';try{const result=await api(`/1/api/devices/${encodeURIComponent(device.device_id)}/photos`);if(selectedId!==device.device_id)return;document.getElementById('photos').innerHTML=(result.photos||[]).map(photo=>`<div class="photo-item"><a href="${esc(photo.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(photo.url)}" alt="设备照片"></a><div class="photo-meta">${esc(photo.width)} × ${esc(photo.height)} · ${esc((Number(photo.size_bytes)/1024).toFixed(1))} KB<br>${esc(photo.captured_at)}${photo.captured_at_source==='server'?'（服务器接收时间）':''}</div></div>`).join('')||'<span class="muted">尚未收到照片</span>'}catch(error){document.getElementById('photos').innerHTML=`<span class="muted">照片加载失败：${esc(error.message)}</span>`}}
function renderDetail(device,renderConfig=true){selectedId=device.device_id;document.getElementById('detail').style.display='block';document.getElementById('detail-title').textContent=device.name||device.device_id;if(!nameDirty)document.getElementById('device-name').value=device.name||device.device_id;const syncText=device.config_synced?`已同步到设备（版本 ${Number(device.config_version||0)}）`:`等待设备确认（服务器 ${Number(device.config_version||0)} / 已报告 ${device.device_config_version??'-'} / ACK ${device.config_ack_version??'-'}）`;const bleText=device.ble_paired?`BLE 已配对 · 最近 ${fmt(device.last_ble_at)}`:`BLE ${device.ble_session_state==='failed'?'最近连接失败':'尚未配对'}`;document.getElementById('detail-summary').innerHTML=`<div class="muted">设备 ID：${esc(device.device_id)}</div><p>${device.online?'在线':'离线'} · 最后沟通 ${esc(fmt(device.last_seen_at))} · ${esc(device.communication||'-')} · ${esc(syncText)}</p><p class="muted">${esc(bleText)}${device.ble_status?.rssi!==undefined?` · RSSI ${esc(device.ble_status.rssi)} dBm`:''}${device.ble_last_error?` · ${esc(device.ble_last_error)}`:''}</p>`;document.getElementById('components').innerHTML=componentHtml(device);if(renderConfig){document.getElementById('config-fields').innerHTML=configHtml(device)}if(!configDirty)document.getElementById('config-status').textContent=syncText;const photoMarker=device.last_photo?.photo_id||'none';if(photoMarker!==loadedPhotoMarker){loadedPhotoMarker=photoMarker;loadPhotos(device)}document.getElementById('last-status').innerHTML=dataGrid(device.last_status);document.getElementById('last-data').innerHTML=dataGrid(device.last_telemetry?.data)}
function openDevice(id){const device=devices.find(item=>item.device_id===id);if(device){configDirty=false;nameDirty=false;loadedPhotoMarker=null;document.getElementById('config-status').textContent='';document.getElementById('name-status').textContent='';renderDetail(device,true);window.scrollTo({top:document.getElementById('detail').offsetTop,behavior:'smooth'})}}
function closeDetail(){selectedId=null;configDirty=false;nameDirty=false;loadedPhotoMarker=null;document.getElementById('detail').style.display='none'}
async function approveDevice(id){await api(`/1/api/devices/${encodeURIComponent(id)}/approve`,{method:'POST'});await loadDevices()}
async function deleteDevice(id,pending=false){if(!confirm(pending?'确定删除这个待批准请求？':'确定彻底删除该设备？设备下次通信会收到 device-not-found。'))return;await api(`/1/api/devices/${encodeURIComponent(id)}`,{method:'DELETE'});if(selectedId===id)closeDetail();await loadDevices()}
document.getElementById('config-fields').addEventListener('input',()=>{configDirty=true;document.getElementById('config-status').textContent='有尚未保存的修改'});document.getElementById('config-fields').addEventListener('change',()=>{configDirty=true;document.getElementById('config-status').textContent='有尚未保存的修改'});
document.getElementById('device-name').addEventListener('input',()=>{nameDirty=true;document.getElementById('name-status').textContent='有尚未保存的修改'});
document.getElementById('name-form').addEventListener('submit',async event=>{event.preventDefault();if(!selectedId)return;const name=document.getElementById('device-name').value.trim();if(!name)return;const result=await api(`/1/api/devices/${encodeURIComponent(selectedId)}/name`,{method:'PUT',body:JSON.stringify({name})});nameDirty=false;const index=devices.findIndex(item=>item.device_id===selectedId);if(index>=0)devices[index]=result.device;renderDetail(result.device,!configDirty);document.getElementById('name-status').textContent='名称已保存'});
document.getElementById('config-form').addEventListener('submit',async event=>{event.preventDefault();if(!selectedId)return;const values={};document.querySelectorAll('#config-fields [data-key]').forEach(input=>{const type=input.dataset.type;values[input.dataset.key]=type==='boolean'?input.checked:type==='integer'?Number.parseInt(input.value,10):type==='number'?Number.parseFloat(input.value):input.value});const result=await api(`/1/api/devices/${encodeURIComponent(selectedId)}/config`,{method:'PUT',body:JSON.stringify({values})});configDirty=false;const index=devices.findIndex(item=>item.device_id===selectedId);if(index>=0)devices[index]=result.device;renderDetail(result.device,true);document.getElementById('config-status').textContent=`已保存，配置版本 ${result.device.config_version}；设备下次通信时应用`});
document.getElementById('delete-device').onclick=()=>selectedId&&deleteDevice(selectedId);document.getElementById('pair').onclick=async()=>{await api('/1/api/devices/pairing/start',{method:'POST'});await loadDevices()};document.getElementById('stop').onclick=async()=>{await api('/1/api/devices/pairing/stop',{method:'POST'});await loadDevices()};loadDevices();startDeviceStream();
</script></body></html>
