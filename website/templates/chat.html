<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天大厅</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { background: #f4f6fb; }
    .page {
      height: 100dvh;
      overflow: hidden;
      box-sizing: border-box;
    }
    .container.chat-shell {
      height: 100%;
      max-height: 100%;
    }
    .chat-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      overflow: hidden;
    }
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    .header-title { display: flex; align-items: center; gap: 10px; }
    .header-title h1 { margin: 0; font-size: 20px; }
    .status-line {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .online-count { color: #4b5563; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; }
    .status-dot.online { background: #10b981; }
    .me-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #eef2ff;
      border: 1px solid #dbe3ff;
      font-size: 24px;
      flex: 0 0 auto;
    }
    .me-name {
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }
    .chat-card {
      position: relative;
      min-height: 0;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      display: grid;
      grid-template-rows: 1fr;
    }
    .messages {
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overscroll-behavior: contain;
    }
    .new-message-btn {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.18);
      cursor: pointer;
      z-index: 3;
    }
    .new-message-btn.show { display: inline-flex; }
    .message-row {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    .message-row.mine {
      grid-template-columns: minmax(0, 1fr) 42px;
    }
    .message-row.mine .avatar { grid-column: 2; grid-row: 1; }
    .message-row.mine .message-main { grid-column: 1; grid-row: 1; align-items: flex-end; }
    .message-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .message-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: #6b7280;
      font-size: 12px;
    }
    .message-row.mine .message-meta { justify-content: flex-end; }
    .sender-name { color: #374151; font-weight: 700; }
    .bubble {
      width: fit-content;
      max-width: min(620px, 100%);
      padding: 10px 12px;
      border-radius: 8px;
      background: #f3f4f6;
      color: #111827;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message-row.mine .bubble { background: #dbeafe; }
    .empty {
      margin: auto;
      color: #9ca3af;
      text-align: center;
      padding: 40px 20px;
    }
    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    .composer input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 11px 12px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 640px) {
      .page { padding: 8px; }
      .chat-header { align-items: flex-start; flex-direction: column; }
      .composer { grid-template-columns: 1fr; }
      .toolbar { width: 100%; justify-content: space-between; }
      .me-name { max-width: 220px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="container chat-shell">
      <header class="chat-header">
        <div class="header-title">
          <span id="statusDot" class="status-dot"></span>
          <div>
            <h1>聊天大厅</h1>
            <div class="status-line muted">
              <span id="statusText">连接中...</span>
              <span id="onlineCount" class="online-count">当前在线人数：--</span>
            </div>
          </div>
        </div>
        <div class="toolbar">
          <div class="me-panel">
            <span id="meAvatar" class="avatar">💬</span>
            <span id="meName" class="me-name">分配中...</span>
          </div>
          <button class="btn" id="shuffleBtn" type="button">换一个</button>
          <a class="btn" href="/">返回首页</a>
        </div>
      </header>

      <main class="chat-card">
        <div id="messages" class="messages">
          <div class="empty">正在进入大厅...</div>
        </div>
        <button id="newMessageBtn" class="new-message-btn" type="button">新消息 ↓</button>
      </main>

      <form id="composer" class="composer">
        <input id="messageInput" autocomplete="off" maxlength="1000" placeholder="输入消息，按 Enter 发送">
        <button class="btn btn-primary" type="submit">发送</button>
      </form>
    </div>
  </div>

  <script src="/static/js/socket.io.min.js"></script>
  <script>
    const DEVICE_KEY = 'chat_lobby_device_id';
    let deviceId = localStorage.getItem(DEVICE_KEY);
    if (!deviceId) {
      deviceId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'dev-' + Date.now() + '-' + Math.random().toString(16).slice(2);
      localStorage.setItem(DEVICE_KEY, deviceId);
    }

    const socket = io({ transports: ['websocket', 'polling'] });
    let messages = [];
    let lastSyncCursor = '';
    let me = null;
    let unreadMessages = 0;

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const onlineCount = document.getElementById('onlineCount');
    const meAvatar = document.getElementById('meAvatar');
    const meName = document.getElementById('meName');
    const messagesEl = document.getElementById('messages');
    const newMessageBtn = document.getElementById('newMessageBtn');
    const inputEl = document.getElementById('messageInput');

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function parseTs(ts) {
      const time = Date.parse(ts);
      return Number.isFinite(time) ? time : 0;
    }

    function formatTime(ts) {
      const time = parseTs(ts);
      if (!time) return '';
      const diffMs = Date.now() - time;
      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;
      if (diffMs >= 0 && diffMs < minute) return '刚刚';
      if (diffMs >= 0 && diffMs < hour) return Math.floor(diffMs / minute) + ' 分钟前';
      if (diffMs >= 0 && diffMs < day) return Math.floor(diffMs / hour) + ' 小时前';
      const d = new Date(time);
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function updateMe(profile) {
      if (!profile) return;
      me = profile;
      meAvatar.textContent = profile.avatar || '💬';
      meName.textContent = profile.name || '匿名旅人';
    }

    function updatePresence(payload) {
      if (!payload || typeof payload.online_count !== 'number') return;
      onlineCount.textContent = `当前在线人数：${payload.online_count}`;
    }

    function shouldStickToBottom() {
      return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
      unreadMessages = 0;
      updateNewMessageButton();
    }

    function updateNewMessageButton() {
      const show = unreadMessages > 0 && !shouldStickToBottom();
      newMessageBtn.classList.toggle('show', show);
      newMessageBtn.textContent = unreadMessages > 1 ? `${unreadMessages} 条新消息 ↓` : '新消息 ↓';
    }

    function markIncomingMessage(count, wasAtBottom) {
      if (!count) return;
      if (wasAtBottom) {
        unreadMessages = 0;
      } else {
        unreadMessages += count;
      }
      updateNewMessageButton();
    }

    function rememberCursor(payload) {
      if (payload && payload.server_time) lastSyncCursor = payload.server_time;
    }

    function rememberMessageCursor(incoming) {
      const latestTs = incoming.reduce((latest, msg) => {
        return parseTs(msg && msg.ts) > parseTs(latest) ? msg.ts : latest;
      }, lastSyncCursor);
      if (latestTs && parseTs(latestTs) > parseTs(lastSyncCursor)) lastSyncCursor = latestTs;
    }

    function mergeMessages(incoming) {
      if (!Array.isArray(incoming) || !incoming.length) return false;
      const byId = new Map(messages.map(msg => [msg.id, msg]));
      incoming.forEach(msg => {
        if (msg && msg.id) byId.set(msg.id, msg);
      });
      messages = Array.from(byId.values()).sort((a, b) => parseTs(a.ts) - parseTs(b.ts) || String(a.id).localeCompare(String(b.id)));
      return true;
    }

    function updateProfileForDevice(deviceIdToUpdate, sender) {
      if (!deviceIdToUpdate || !sender) return;
      messages = messages.map(msg => {
        if (msg.device_id !== deviceIdToUpdate) return msg;
        return { ...msg, sender };
      });
      if (deviceIdToUpdate === deviceId) updateMe(sender);
      renderMessages();
    }

    function renderMessages() {
      const stick = shouldStickToBottom();
      const sorted = [...messages].sort((a, b) => parseTs(a.ts) - parseTs(b.ts) || String(a.id).localeCompare(String(b.id)));
      if (!sorted.length) {
        messagesEl.innerHTML = '<div class="empty">还没有消息，发一句开始聊天。</div>';
        return;
      }
      messagesEl.innerHTML = sorted.map(msg => {
        const mine = msg.device_id === deviceId;
        const sender = msg.sender || {};
        return `
          <div class="message-row ${mine ? 'mine' : ''}" data-id="${escapeHtml(msg.id)}">
            <span class="avatar">${escapeHtml(sender.avatar || '💬')}</span>
            <div class="message-main">
              <div class="message-meta">
                <span class="sender-name">${escapeHtml(sender.name || '匿名旅人')}</span>
                <span>${escapeHtml(formatTime(msg.ts))}</span>
              </div>
              <div class="bubble">${escapeHtml(msg.text)}</div>
            </div>
          </div>
        `;
      }).join('');
      if (stick) scrollToBottom();
      updateNewMessageButton();
    }

    function applyState(payload) {
      if (payload.me) updateMe(payload.me);
      updatePresence(payload);
      messages = [];
      mergeMessages(Array.isArray(payload.messages) ? payload.messages : []);
      rememberCursor(payload);
      renderMessages();
    }

    function applySync(payload) {
      if (payload.me) updateMe(payload.me);
      const wasAtBottom = shouldStickToBottom();
      const beforeIds = new Set(messages.map(msg => msg.id));
      const incoming = Array.isArray(payload.messages) ? payload.messages : [];
      const changed = mergeMessages(Array.isArray(payload.messages) ? payload.messages : []);
      rememberCursor(payload);
      if (changed) {
        const newCount = incoming.filter(msg => msg && msg.id && !beforeIds.has(msg.id)).length;
        renderMessages();
        markIncomingMessage(newCount, wasAtBottom);
      }
    }

    async function syncMessages() {
      const params = new URLSearchParams({ device_id: deviceId });
      if (lastSyncCursor) params.set('since', lastSyncCursor);
      try {
        const response = await fetch('/api/chat/sync?' + params.toString(), { cache: 'no-store' });
        if (!response.ok) return;
        applySync(await response.json());
      } catch (err) {
        statusText.textContent = '同步延迟，等待重试...';
      }
    }

    socket.on('connect', () => {
      statusDot.classList.add('online');
      statusText.textContent = '已在线';
      socket.emit('chat_join', { device_id: deviceId });
      syncMessages();
    });

    socket.on('disconnect', () => {
      statusDot.classList.remove('online');
      statusText.textContent = '连接断开，正在重连...';
    });

    socket.on('chat_joined', applyState);
    socket.on('chat_presence', updatePresence);
    socket.on('chat_state', applyState);
    socket.on('chat_profile', payload => {
      rememberCursor(payload);
      if (payload && payload.sender) updateProfileForDevice(deviceId, payload.sender);
    });
    socket.on('chat_new_message', payload => {
      const wasAtBottom = shouldStickToBottom();
      const beforeIds = new Set(messages.map(msg => msg.id));
      const incoming = payload && payload.message ? [payload.message] : [];
      const changed = mergeMessages(incoming);
      rememberMessageCursor(incoming);
      if (changed) {
        const newCount = incoming.filter(msg => msg && msg.id && !beforeIds.has(msg.id)).length;
        renderMessages();
        markIncomingMessage(newCount, wasAtBottom);
      }
    });
    socket.on('chat_profile_changed', payload => {
      rememberCursor(payload);
      if (payload && payload.device_id && payload.sender) {
        updateProfileForDevice(payload.device_id, payload.sender);
      }
    });
    socket.on('chat_error', payload => {
      statusText.textContent = payload && payload.error ? payload.error : '发送失败';
    });

    document.getElementById('composer').addEventListener('submit', event => {
      event.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;
      socket.emit('chat_send', { device_id: deviceId, text });
      inputEl.value = '';
      inputEl.focus();
    });

    document.getElementById('shuffleBtn').addEventListener('click', () => {
      socket.emit('chat_shuffle_profile', { device_id: deviceId });
    });

    newMessageBtn.addEventListener('click', scrollToBottom);
    messagesEl.addEventListener('scroll', () => {
      if (shouldStickToBottom()) unreadMessages = 0;
      updateNewMessageButton();
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) syncMessages();
    });
    window.addEventListener('online', syncMessages);

    syncMessages();
    setInterval(syncMessages, 30 * 1000);
    setInterval(renderMessages, 60 * 1000);
  </script>
</body>
</html>
