{% from "_site_shell.html" import site_shell %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>实时游戏大厅</title>
    <link rel="stylesheet" href="/static/css/site-shell.css">
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --accent: #22c55e;
        --muted: #94a3b8;
        --text: #e2e8f0;
        --danger: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Trebuchet MS", "Lucida Sans", Arial, sans-serif;
        background: radial-gradient(circle at 10% 10%, #1e293b, #0f172a);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 24px 20px 0;
      }
      header h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: 0.5px;
      }
      header p {
        margin: 0;
        color: var(--muted);
      }
      main {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) 2fr;
        gap: 20px;
        padding: 20px;
        flex: 1;
      }
      body.room-active main {
        grid-template-columns: 1fr;
      }
      .panel {
        background: var(--panel);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      }
      #roomPanel {
        padding: 0;
      }
      #roomPanel .room-content {
        padding: 18px;
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-size: 14px;
        color: var(--muted);
      }
      input, select, button, textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #1f2937;
        background: #0b1220;
        color: var(--text);
        font-size: 14px;
      }
      button {
        cursor: pointer;
        background: var(--accent);
        color: #052e16;
        font-weight: 700;
        margin-top: 12px;
        border: none;
      }
      button.secondary {
        background: #0b1220;
        color: var(--text);
        border: 1px solid #1f2937;
      }
      button.danger {
        background: var(--danger);
        color: #450a0a;
      }
      .status {
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
        word-break: break-word;
      }
      .state-box {
        background: #020617;
        padding: 14px;
        border-radius: 12px;
        min-height: 180px;
        font-family: "Courier New", monospace;
        font-size: 13px;
        white-space: pre-wrap;
        color: #e2e8f0;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin-top: 12px;
      }
      .iframe-box {
        margin-top: 16px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #1f2937;
        background: #0b1220;
        position: relative;
        height: 100vh;
      }
      .iframe-box iframe {
        width: 100%;
        height: 100%;
        display: block;
        border: 0;
        pointer-events: auto;
      }
      #roomPanel .iframe-box {
        margin: 0;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        height: 100vh;
      }
      .inline-row {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 10px;
        margin-top: 10px;
      }
      .actions button {
        width: auto;
        padding: 10px 16px;
      }
      .room-list {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }
      .room-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid #1f2937;
        background: #0b1220;
      }
      .room-item span {
        display: block;
        font-size: 13px;
      }
      .room-item .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 11px;
        background: #1f2937;
        color: var(--text);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }
      .hidden {
        display: none;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
        #roomPanel .iframe-box {
          height: 100vh;
        }
      }
    </style>
  </head>
  <body class="site-full-height">
    {% if room_id %}
      {{ site_shell('/game/', '返回游戏大厅', 'parent') }}
    {% else %}
      {{ site_shell('/', '返回首页', 'home') }}
    {% endif %}
    <header>
      <h1>实时游戏大厅</h1>
      <p>房间即状态来源。加入房间或创建新房间。</p>
    </header>
    <main>
      <section class="panel" id="lobbyPanel">
        <h2>大厅</h2>
        <div class="status" id="connectionStatus">未连接。</div>
        <div class="status" id="onlineStatus">在线人数：0</div>

        <label for="roomId">创建房间</label>
        <div class="row">
          <input id="roomId" type="text" placeholder="room-001" value="{{ room_id }}" />
          <button id="generateRoomBtn" class="secondary" type="button">随机</button>
        </div>
        <label for="roomPassword">房间密码（可选）</label>
        <input id="roomPassword" type="text" placeholder="可选密码" />
        <button id="createBtn">创建并加入</button>

        <label>可加入房间</label>
        <div class="room-list" id="roomList"></div>
        <div class="status" id="lobbyStatus"></div>
      </section>

      <section class="panel hidden" id="roomPanel">
        <div class="room-content">
          <h2>房间</h2>
          <div class="status" id="roomStatus">未加入房间。</div>
          <div class="status" id="seatStatus"></div>


          <label for="newRoomPassword">修改房间密码</label>
          <input id="newRoomPassword" type="text" placeholder="留空则清除" />
          <button id="updatePasswordBtn" class="secondary">更新密码</button>
          <button id="leaveBtn" class="danger">离开房间</button>

          <h3>悔棋</h3>
          <div class="status" id="undoStatus">无悔棋请求。</div>
          <div class="inline-row">
            <button id="undoRequestBtn" class="secondary">申请悔棋</button>
            <button id="undoApproveBtn" class="secondary hidden">同意</button>
            <button id="undoRejectBtn" class="secondary hidden">拒绝</button>
          </div>

          <h3>棋类对战（boardgame.io）</h3>
          <div class="inline-row">
            <select id="bgioGameSelect">
              <option value="chess">国际象棋</option>
            </select>
            <select id="bgioPlayerSelect">
              <option value="0">白方</option>
              <option value="1">黑方</option>
            </select>
            <button id="bgioOpenBtn" class="secondary">加载棋盘</button>
          </div>
          <div class="status" id="bgioStatus">使用当前房间号作为对局 ID。</div>
        </div>
        <div class="iframe-box">
          <iframe id="bgioFrame" title="Boardgame.io"></iframe>
        </div>
      </section>
    </main>

    <script src="/static/js/socket.io.min.js"></script>
    <script>
      let socket = null;
      const lobbyPanel = document.getElementById("lobbyPanel");
      const roomPanel = document.getElementById("roomPanel");
      const connectionStatus = document.getElementById("connectionStatus");
      const onlineStatus = document.getElementById("onlineStatus");
      const lobbyStatus = document.getElementById("lobbyStatus");
      const roomIdInput = document.getElementById("roomId");
      const roomPasswordInput = document.getElementById("roomPassword");
      const generateRoomBtn = document.getElementById("generateRoomBtn");
      const createBtn = document.getElementById("createBtn");
      const roomList = document.getElementById("roomList");

      const roomStatus = document.getElementById("roomStatus");
      const seatStatus = document.getElementById("seatStatus");
      const newRoomPasswordInput = document.getElementById("newRoomPassword");
      const updatePasswordBtn = document.getElementById("updatePasswordBtn");
      const leaveBtn = document.getElementById("leaveBtn");
      const undoStatus = document.getElementById("undoStatus");
      const undoRequestBtn = document.getElementById("undoRequestBtn");
      const undoApproveBtn = document.getElementById("undoApproveBtn");
      const undoRejectBtn = document.getElementById("undoRejectBtn");
      const bgioGameSelect = document.getElementById("bgioGameSelect");
      const bgioPlayerSelect = document.getElementById("bgioPlayerSelect");
      const bgioOpenBtn = document.getElementById("bgioOpenBtn");
      const bgioFrame = document.getElementById("bgioFrame");
      const bgioStatus = document.getElementById("bgioStatus");

      let currentRoomId = "{{ room_id }}";
      let currentSeat = null;
      let roomSeats = {};
      let undoRequest = null;
      let pendingUndo = false;

      function updateConnectionStatus(message) {
        connectionStatus.textContent = message;
      }

      function updateLobbyStatus(message) {
        lobbyStatus.textContent = message;
      }

      function updateRoomStatus(message) {
        roomStatus.textContent = message;
      }

      function updateUndoStatus(message) {
        undoStatus.textContent = message;
      }

      function updateUndoUI() {
        if (!currentRoomId || !currentSeat) {
          updateUndoStatus("无悔棋请求。");
          undoRequestBtn.classList.remove("hidden");
          undoApproveBtn.classList.add("hidden");
          undoRejectBtn.classList.add("hidden");
          undoRequestBtn.disabled = false;
          return;
        }
        if (!undoRequest) {
          updateUndoStatus("无悔棋请求。");
          undoRequestBtn.classList.remove("hidden");
          undoApproveBtn.classList.add("hidden");
          undoRejectBtn.classList.add("hidden");
          undoRequestBtn.disabled = false;
          return;
        }
        if (undoRequest.from_seat === currentSeat) {
          updateUndoStatus("已申请悔棋，等待对方同意。");
          undoRequestBtn.classList.remove("hidden");
          undoApproveBtn.classList.add("hidden");
          undoRejectBtn.classList.add("hidden");
          undoRequestBtn.disabled = true;
          return;
        }
        updateUndoStatus("对方申请悔棋。");
        undoRequestBtn.classList.add("hidden");
        undoApproveBtn.classList.remove("hidden");
        undoRejectBtn.classList.remove("hidden");
        undoRequestBtn.disabled = true;
      }

      function seatToPlayerID(seat) {
        if (seat === 1) return "0";
        if (seat === 2) return "1";
        return "";
      }

      function playerIDToSeat(playerID) {
        if (playerID === "0") return 1;
        if (playerID === "1") return 2;
        return null;
      }

      function updateSeatOptions() {
        const takenSeats = new Set(Object.values(roomSeats || {}));
        const whiteOption = bgioPlayerSelect.querySelector('option[value="0"]');
        const blackOption = bgioPlayerSelect.querySelector('option[value="1"]');
        const seat1Taken = takenSeats.has(1);
        const seat2Taken = takenSeats.has(2);
        if (currentSeat) {
          const currentPlayerID = seatToPlayerID(currentSeat);
          if (currentPlayerID) {
            bgioPlayerSelect.value = currentPlayerID;
          }
        }
        if (whiteOption) {
          whiteOption.disabled = seat1Taken && currentSeat !== 1;
        }
        if (blackOption) {
          blackOption.disabled = seat2Taken && currentSeat !== 2;
        }
        bgioPlayerSelect.disabled = seat1Taken && seat2Taken;
      }


      function showLobby() {
        document.body.classList.remove("room-active");
        lobbyPanel.classList.remove("hidden");
        roomPanel.classList.add("hidden");
      }

      function showRoom() {
        document.body.classList.add("room-active");
        lobbyPanel.classList.add("hidden");
        roomPanel.classList.remove("hidden");
      }

      function generateRoomId() {
        const suffix = Math.random().toString(36).slice(2, 6);
        roomIdInput.value = `room-${suffix}`;
      }

      function updateBoardgameFrame() {
        if (!currentRoomId) {
          bgioStatus.textContent = "请先加入房间再加载棋盘。";
          return;
        }
        const cacheBuster = Date.now();
        const game = bgioGameSelect.value;
        const playerID = bgioPlayerSelect.value;
        const route = `/static/bgio/index.html?v=${cacheBuster}#/chess/multiplayer${playerID}?room=${encodeURIComponent(currentRoomId)}&embed=1`;
        bgioFrame.src = route;
        bgioStatus.textContent = `已加载 ${game}（房间 ${currentRoomId}）。`;
      }

      function triggerUndoInFrame() {
        if (bgioFrame.contentWindow) {
          bgioFrame.contentWindow.postMessage({ type: "bgio-undo" }, window.location.origin);
          pendingUndo = false;
        } else {
          pendingUndo = true;
        }
      }

      function renderRooms(rooms) {
        roomList.innerHTML = "";
        if (!rooms.length) {
          roomList.innerHTML = "<div class=\"status\">当前没有房间。</div>";
          return;
        }
        rooms.forEach((room) => {
          const item = document.createElement("div");
          item.className = "room-item";
          const info = document.createElement("div");
          info.innerHTML = `
            <strong>${room.room_id}</strong>
            <span class="meta">人数：${room.players} ${room.has_password ? '<span class="badge">有密码</span>' : ""}</span>
            <span class="meta">游戏：${room.game_type || "未设置"}</span>
          `;
          const joinBtn = document.createElement("button");
          joinBtn.textContent = "加入";
          joinBtn.className = "secondary";
          joinBtn.addEventListener("click", () => {
            const password = room.has_password
              ? window.prompt("请输入房间密码：")
              : "";
            socket.emit("join_room", {
              room_id: room.room_id,
              password: password || null,
              game_type: null,
            });
          });
          item.appendChild(info);
          item.appendChild(joinBtn);
          roomList.appendChild(item);
        });
      }

      generateRoomBtn.addEventListener("click", generateRoomId);

      createBtn.addEventListener("click", () => {
        const roomId = roomIdInput.value.trim();
        if (!roomId) {
          updateLobbyStatus("请输入房间号。");
          return;
        }
        socket.emit("join_room", {
          room_id: roomId,
          password: roomPasswordInput.value || null,
          game_type: null,
        });
      });

      updatePasswordBtn.addEventListener("click", () => {
        socket.emit("set_room_password", { password: newRoomPasswordInput.value });
      });

      leaveBtn.addEventListener("click", () => {
        socket.emit("leave_room", { force: true });
        currentRoomId = "";
        currentSeat = null;
        roomSeats = {};
        undoRequest = null;
        newRoomPasswordInput.value = "";
        updateRoomStatus("已离开房间。");
        updateSeatOptions();
        updateUndoUI();
        showLobby();
        socket.emit("request_lobby");
      });

      undoRequestBtn.addEventListener("click", () => {
        socket.emit("request_undo");
      });

      undoApproveBtn.addEventListener("click", () => {
        socket.emit("approve_undo");
      });

      undoRejectBtn.addEventListener("click", () => {
        socket.emit("reject_undo");
      });

      bgioPlayerSelect.addEventListener("change", () => {
        const requestedSeat = playerIDToSeat(bgioPlayerSelect.value);
        if (!requestedSeat || !currentRoomId) {
          return;
        }
        if (requestedSeat === currentSeat) {
          return;
        }
        if (Object.values(roomSeats || {}).includes(requestedSeat)) {
          updateRoomStatus("该位置已有人，无法切换。");
          updateSeatOptions();
          return;
        }
        socket.emit("switch_seat", { seat: requestedSeat });
      });

      bgioOpenBtn.addEventListener("click", updateBoardgameFrame);

      bgioFrame.addEventListener("load", () => {
        if (pendingUndo) {
          triggerUndoInFrame();
        }
      });

      function wireSocketEvents() {
        socket.on("connect", () => {
          updateConnectionStatus("已连接，可加入房间。");
          socket.emit("request_lobby");
          if (currentRoomId) {
            socket.emit("join_room", {
              room_id: currentRoomId,
              password: roomPasswordInput.value || null,
              game_type: null,
            });
          }
        });

        socket.on("disconnect", () => {
        updateConnectionStatus("连接已断开。");
      });

        socket.on("lobby_rooms", (data) => {
          renderRooms(data.rooms || []);
        });

        socket.on("lobby_stats", (data) => {
        onlineStatus.textContent = `在线人数：${data.connected}`;
      });

      socket.on("join_ok", (data) => {
          currentRoomId = data.room_id;
          currentSeat = data.seat;
        updateRoomStatus(`已加入 ${data.room_id}。人数：${data.players}`);
        seatStatus.textContent = `座位：${data.seat || "待分配"}`;
        newRoomPasswordInput.value = data.room_password || "";
        showRoom();
        if (data.seat === 1) {
          bgioPlayerSelect.value = "0";
        } else if (data.seat === 2) {
          bgioPlayerSelect.value = "1";
        }
        roomSeats = data.seats || {};
        updateSeatOptions();
        undoRequest = null;
        updateUndoUI();
        updateBoardgameFrame();
      });

        socket.on("join_error", (data) => {
        updateLobbyStatus(`加入失败：${data.reason}`);
      });

      socket.on("room_update", (data) => {
        if (data.room_id === currentRoomId) {
          updateRoomStatus(`房间 ${data.room_id}：当前 ${data.players} 人在线。`);
          roomSeats = data.seats || {};
          updateSeatOptions();
        }
      });

      socket.on("seat_changed", (data) => {
        if (!data) {
          return;
        }
        currentSeat = data.seat;
        seatStatus.textContent = `座位：${currentSeat || "待分配"}`;
        updateSeatOptions();
        updateUndoUI();
        updateBoardgameFrame();
      });

      socket.on("undo_requested", (data) => {
        undoRequest = data || null;
        updateUndoUI();
        if (!undoRequest || undoRequest.from_seat === currentSeat) {
          return;
        }
        const requester = undoRequest.from_seat === 1 ? "白方" : "黑方";
        const approved = window.confirm(`${requester} 申请悔棋，是否同意？`);
        if (approved) {
          socket.emit("approve_undo");
        } else {
          socket.emit("reject_undo");
        }
      });

      socket.on("undo_rejected", (data) => {
        undoRequest = null;
        updateUndoStatus(data && data.reason === "requester_left" ? "对方已离开，悔棋请求取消。" : "悔棋已拒绝。");
        updateUndoUI();
      });

      socket.on("undo_approved", (data) => {
        undoRequest = null;
        updateUndoStatus("已同意悔棋。");
        updateUndoUI();
        if (data && currentSeat === data.from_seat) {
          triggerUndoInFrame();
        }
      });

      socket.on("undo_error", (data) => {
        const reason = data && data.reason ? data.reason : "unknown";
        updateUndoStatus(`悔棋失败：${reason}`);
        updateUndoUI();
      });

        socket.on("room_password_updated", (data) => {
        updateRoomStatus(`房间密码已更新。加锁：${data.has_password}`);
        newRoomPasswordInput.value = data.room_password || "";
      });

        socket.on("room_error", (data) => {
        updateRoomStatus(`房间错误：${data.reason}`);
      });

        window.addEventListener("beforeunload", () => {
          socket.disconnect();
        });
      }

      if (!roomIdInput.value.trim()) {
        generateRoomId();
      }

      if (typeof io === "undefined") {
        updateConnectionStatus("Socket.IO 客户端加载失败。");
      } else {
        socket = io();
        wireSocketEvents();
      }
    </script>
    <script src="/static/js/net_metrics.js"></script>
</body>
</html>
