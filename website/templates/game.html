<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>实时游戏大厅</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --accent: #22c55e;
        --muted: #94a3b8;
        --text: #e2e8f0;
        --danger: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Trebuchet MS", "Lucida Sans", Arial, sans-serif;
        background: radial-gradient(circle at 10% 10%, #1e293b, #0f172a);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 24px 20px 0;
      }
      header h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: 0.5px;
      }
      header p {
        margin: 0;
        color: var(--muted);
      }
      main {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) 2fr;
        gap: 20px;
        padding: 20px;
        flex: 1;
      }
      .panel {
        background: var(--panel);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-size: 14px;
        color: var(--muted);
      }
      input, select, button, textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #1f2937;
        background: #0b1220;
        color: var(--text);
        font-size: 14px;
      }
      button {
        cursor: pointer;
        background: var(--accent);
        color: #052e16;
        font-weight: 700;
        margin-top: 12px;
        border: none;
      }
      button.secondary {
        background: #0b1220;
        color: var(--text);
        border: 1px solid #1f2937;
      }
      button.danger {
        background: var(--danger);
        color: #450a0a;
      }
      .status {
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
        word-break: break-word;
      }
      .state-box {
        background: #020617;
        padding: 14px;
        border-radius: 12px;
        min-height: 180px;
        font-family: "Courier New", monospace;
        font-size: 13px;
        white-space: pre-wrap;
        color: #e2e8f0;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin-top: 12px;
      }
      .actions button {
        width: auto;
        padding: 10px 16px;
      }
      .room-list {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }
      .room-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid #1f2937;
        background: #0b1220;
      }
      .room-item span {
        display: block;
        font-size: 13px;
      }
      .room-item .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 11px;
        background: #1f2937;
        color: var(--text);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }
      .hidden {
        display: none;
      }
      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>实时游戏大厅</h1>
      <p>房间即状态来源。加入房间或创建新房间。</p>
    </header>
    <main>
      <section class="panel" id="lobbyPanel">
        <h2>大厅</h2>
        <div class="status" id="connectionStatus">未连接。</div>
        <div class="status" id="onlineStatus">在线人数：0</div>

        <label for="roomId">创建房间</label>
        <div class="row">
          <input id="roomId" type="text" placeholder="room-001" value="{{ room_id }}" />
          <button id="generateRoomBtn" class="secondary" type="button">随机</button>
        </div>
        <label for="roomPassword">房间密码（可选）</label>
        <input id="roomPassword" type="text" placeholder="可选密码" />
        <button id="createBtn">创建并加入</button>

        <label>可加入房间</label>
        <div class="room-list" id="roomList"></div>
        <div class="status" id="lobbyStatus"></div>
      </section>

      <section class="panel hidden" id="roomPanel">
        <h2>房间</h2>
        <div class="status" id="roomStatus">未加入房间。</div>
        <div class="status" id="seatStatus"></div>

        <label for="gameType">游戏类型</label>
        <select id="gameType">
          <option value="">选择</option>
          <option value="xiangqi">象棋</option>
          <option value="go">围棋</option>
          <option value="gomoku">五子棋</option>
          <option value="custom">自定义</option>
        </select>

        <label for="newRoomPassword">修改房间密码</label>
        <input id="newRoomPassword" type="text" placeholder="留空则清除" />
        <button id="updatePasswordBtn" class="secondary">更新密码</button>
        <button id="leaveBtn" class="danger">离开房间</button>

        <h3>房间状态</h3>
        <div class="state-box" id="stateBox">{}</div>
        <div class="actions">
          <input id="actionInput" placeholder="发送占位动作（如 move）" />
          <button id="sendActionBtn">发送</button>
        </div>
      </section>
    </main>

    <script src="/static/js/socket.io.min.js"></script>
    <script>
      let socket = null;
      const lobbyPanel = document.getElementById("lobbyPanel");
      const roomPanel = document.getElementById("roomPanel");
      const connectionStatus = document.getElementById("connectionStatus");
      const onlineStatus = document.getElementById("onlineStatus");
      const lobbyStatus = document.getElementById("lobbyStatus");
      const roomIdInput = document.getElementById("roomId");
      const roomPasswordInput = document.getElementById("roomPassword");
      const generateRoomBtn = document.getElementById("generateRoomBtn");
      const createBtn = document.getElementById("createBtn");
      const roomList = document.getElementById("roomList");

      const roomStatus = document.getElementById("roomStatus");
      const seatStatus = document.getElementById("seatStatus");
      const gameTypeSelect = document.getElementById("gameType");
      const newRoomPasswordInput = document.getElementById("newRoomPassword");
      const updatePasswordBtn = document.getElementById("updatePasswordBtn");
      const leaveBtn = document.getElementById("leaveBtn");
      const stateBox = document.getElementById("stateBox");
      const actionInput = document.getElementById("actionInput");
      const sendActionBtn = document.getElementById("sendActionBtn");

      let currentRoomId = "{{ room_id }}";
      let currentSeat = null;

      function updateConnectionStatus(message) {
        connectionStatus.textContent = message;
      }

      function updateLobbyStatus(message) {
        lobbyStatus.textContent = message;
      }

      function updateRoomStatus(message) {
        roomStatus.textContent = message;
      }

      function renderState(state) {
        stateBox.textContent = JSON.stringify(state, null, 2);
      }

      function showLobby() {
        lobbyPanel.classList.remove("hidden");
        roomPanel.classList.add("hidden");
      }

      function showRoom() {
        lobbyPanel.classList.add("hidden");
        roomPanel.classList.remove("hidden");
      }

      function generateRoomId() {
        const suffix = Math.random().toString(36).slice(2, 6);
        roomIdInput.value = `room-${suffix}`;
      }

      function renderRooms(rooms) {
        roomList.innerHTML = "";
        if (!rooms.length) {
          roomList.innerHTML = "<div class=\"status\">当前没有房间。</div>";
          return;
        }
        rooms.forEach((room) => {
          const item = document.createElement("div");
          item.className = "room-item";
          const info = document.createElement("div");
          info.innerHTML = `
            <strong>${room.room_id}</strong>
            <span class="meta">人数：${room.players} ${room.has_password ? '<span class="badge">有密码</span>' : ""}</span>
            <span class="meta">游戏：${room.game_type || "未设置"}</span>
          `;
          const joinBtn = document.createElement("button");
          joinBtn.textContent = "加入";
          joinBtn.className = "secondary";
          joinBtn.addEventListener("click", () => {
            const password = room.has_password
              ? window.prompt("请输入房间密码：")
              : "";
            socket.emit("join_room", {
              room_id: room.room_id,
              password: password || null,
              game_type: gameTypeSelect.value || null,
            });
          });
          item.appendChild(info);
          item.appendChild(joinBtn);
          roomList.appendChild(item);
        });
      }

      generateRoomBtn.addEventListener("click", generateRoomId);

      createBtn.addEventListener("click", () => {
        const roomId = roomIdInput.value.trim();
        if (!roomId) {
          updateLobbyStatus("请输入房间号。");
          return;
        }
        socket.emit("join_room", {
          room_id: roomId,
          password: roomPasswordInput.value || null,
          game_type: gameTypeSelect.value || null,
        });
      });

      updatePasswordBtn.addEventListener("click", () => {
        socket.emit("set_room_password", { password: newRoomPasswordInput.value });
      });

      leaveBtn.addEventListener("click", () => {
        socket.emit("leave_room", { force: true });
        currentRoomId = "";
        currentSeat = null;
        newRoomPasswordInput.value = "";
        updateRoomStatus("已离开房间。");
        showLobby();
        socket.emit("request_lobby");
      });

      sendActionBtn.addEventListener("click", () => {
        const action = actionInput.value.trim();
        if (!action) {
          updateRoomStatus("动作不能为空。");
          return;
        }
        socket.emit("player_action", { action });
        actionInput.value = "";
      });

      function wireSocketEvents() {
        socket.on("connect", () => {
          updateConnectionStatus("已连接，可加入房间。");
          socket.emit("request_lobby");
          if (currentRoomId) {
            socket.emit("join_room", {
              room_id: currentRoomId,
              password: roomPasswordInput.value || null,
              game_type: gameTypeSelect.value || null,
            });
          }
        });

        socket.on("disconnect", () => {
        updateConnectionStatus("连接已断开。");
      });

        socket.on("lobby_rooms", (data) => {
          renderRooms(data.rooms || []);
        });

        socket.on("lobby_stats", (data) => {
        onlineStatus.textContent = `在线人数：${data.connected}`;
      });

        socket.on("join_ok", (data) => {
          currentRoomId = data.room_id;
          currentSeat = data.seat;
        updateRoomStatus(`已加入 ${data.room_id}。人数：${data.players}`);
        seatStatus.textContent = `座位：${data.seat || "待分配"}`;
        newRoomPasswordInput.value = data.room_password || "";
        renderState(data.game_state);
        showRoom();
      });

        socket.on("join_error", (data) => {
        updateLobbyStatus(`加入失败：${data.reason}`);
      });

        socket.on("room_update", (data) => {
        if (data.room_id === currentRoomId) {
          updateRoomStatus(`房间 ${data.room_id}：当前 ${data.players} 人在线。`);
        }
      });

        socket.on("room_password_updated", (data) => {
        updateRoomStatus(`房间密码已更新。加锁：${data.has_password}`);
        newRoomPasswordInput.value = data.room_password || "";
      });

        socket.on("room_error", (data) => {
        updateRoomStatus(`房间错误：${data.reason}`);
      });

        socket.on("state_update", (state) => {
          renderState(state);
        });

        socket.on("action_error", (data) => {
        updateRoomStatus(`动作错误：${data.reason}`);
      });

        socket.on("state_error", (data) => {
        updateRoomStatus(`状态错误：${data.reason}`);
      });

        window.addEventListener("beforeunload", () => {
          socket.disconnect();
        });
      }

      if (!roomIdInput.value.trim()) {
        generateRoomId();
      }

      if (typeof io === "undefined") {
        updateConnectionStatus("Socket.IO 客户端加载失败。");
      } else {
        socket = io();
        wireSocketEvents();
      }
    </script>
  </body>
</html>
