<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>租房信息</title><link rel="stylesheet" href="/static/css/base.css">
  <style>.choices{display:flex;gap:18px;flex-wrap:wrap}.status{white-space:pre-wrap;word-break:break-word}.changes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}.change{padding:10px;border:1px solid #d1d5db;border-radius:6px;background:#fff}.live-log{height:300px;overflow:auto;background:#111827;color:#d1fae5;padding:12px;border-radius:8px;font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap}.running{color:#b45309}.ok{color:#166534}.error{color:#991b1b}.notify-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.result-card{padding:0;overflow:hidden}.result-heading{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}.result-heading .card-title{margin:0}.result-frame{display:block;width:100%;height:980px;border:0;background:#fff}@media(max-width:700px){.notify-grid{grid-template-columns:1fr}.result-frame{height:900px}}</style>
</head>
<body><div class="page"><div class="container">
  <div class="page-header" style="display:flex;justify-content:space-between;align-items:center"><div><h1>租房信息</h1><p>SW-KA 私人房源后台追踪</p></div><a class="btn" href="/1/">返回管理面板</a></div>
  <div class="card"><h2 class="card-title">最近变化</h2><div id="changes" class="changes muted">暂无</div></div>
  <div class="card result-card"><div class="result-heading"><div><h2 class="card-title">SW-KA 房源地图与完整表</h2><div class="muted">地图、全文搜索、房型与上下架筛选均直接使用房源结果文件。</div></div><button class="btn" onclick="refreshResult()">刷新结果</button></div><iframe id="resultFrame" class="result-frame" src="/1/housing/result"></iframe></div>
  <div class="card"><h2 class="card-title">运行状态与实时进度</h2><div id="serviceState" class="muted">正在读取进程状态...</div><div id="state" class="status muted" style="margin-top:10px">加载中...</div><div id="liveLog" class="live-log" style="margin-top:12px">尚无运行日志</div></div>
  <div class="card"><h2 class="card-title">追踪设置</h2>
    <div class="grid-2"><div><label>增量搜索间隔（分钟）</label><input id="incrementalInterval" class="input" type="number" min="1" max="10080" style="margin:6px 0 14px"></div><div><label>全量搜索间隔（分钟）</label><input id="fullInterval" class="input" type="number" min="1" max="10080" style="margin:6px 0 14px"></div></div>
    <div class="muted" style="margin-bottom:14px">抓取入口固定使用 Zimmertyp: alle，抓取后再分类为 WG、Einzelzimmer、xZimmer。</div>
    <label>网站登录邮箱/账户</label><input id="username" class="input" autocomplete="username" style="margin:6px 0 14px">
    <label>网站登录密码</label><input id="password" class="input" type="password" autocomplete="new-password" placeholder="留空则保留现有密码" style="margin:6px 0 6px"><label class="muted"><input id="clearPassword" type="checkbox"> 清除已保存密码</label><div id="passwordHelp" class="muted" style="margin-top:6px">密码可以保存在树莓派上；保存后不会从 API 回传到浏览器。</div>
    <div style="margin-top:16px"><label><input id="emailEnabled" type="checkbox"> 有新增或更新时发送邮件</label></div>
    <label style="display:block;margin-top:10px">通知收件地址（支持多个，每行或逗号分隔）</label><textarea id="notificationEmails" class="input" rows="3" style="margin-top:6px"></textarea>
    <div class="notify-grid" style="margin-top:16px"><div><strong>新上架通知</strong><div class="choices" style="margin-top:8px"><label><input type="checkbox" name="addedType" value="wg"> WG</label><label><input type="checkbox" name="addedType" value="einzelzimmer"> Einzelzimmer</label><label><input type="checkbox" name="addedType" value="xzimmer"> xZimmer</label></div></div><div><strong>新下架通知</strong><div class="choices" style="margin-top:8px"><label><input type="checkbox" name="delistedType" value="wg"> WG</label><label><input type="checkbox" name="delistedType" value="einzelzimmer"> Einzelzimmer</label><label><input type="checkbox" name="delistedType" value="xzimmer"> xZimmer</label></div></div></div>
    <div class="toolbar" style="margin-top:16px"><button class="btn btn-primary" onclick="save()">保存设置</button><button class="btn" onclick="runNow('incremental')">运行一次增量搜索</button><button class="btn" onclick="runNow('full')">运行一次全量搜索</button><button id="resendButton" class="btn" onclick="resendNotification()">发送上一次通知邮件</button><button id="initializeButton" class="btn" style="color:#991b1b;border-color:#fca5a5" onclick="initializeHousing()">初始化房源数据库</button></div><div id="note" class="muted" style="margin-top:10px"></div>
  </div>
</div></div><script src="/static/js/auth.js"></script><script>
const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function note(t,e=false){const n=document.getElementById('note');n.textContent=t;n.style.color=e?'#991b1b':'#6b7280'}
async function api(url,method='GET',body=null){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):null});const d=await r.json();if(!d.ok)throw new Error(d.error||'操作失败');return d}
let editing=false,lastLogCount=0;
function render(d){const c=d.config,s=d.state,svc=d.service||{};if(!editing){incrementalInterval.value=c.incremental_interval_minutes;fullInterval.value=c.full_interval_minutes;username.value=c.username||'';emailEnabled.checked=c.email_enabled;notificationEmails.value=(c.notification_emails||[]).join('\n');document.querySelectorAll('[name=addedType]').forEach(x=>x.checked=(c.notify_added_types||[]).includes(x.value));document.querySelectorAll('[name=delistedType]').forEach(x=>x.checked=(c.notify_delisted_types||[]).includes(x.value));}password.placeholder=c.password_configured?'密码已保存在树莓派；留空则不修改':'尚未设置密码';passwordHelp.textContent=c.password_configured?'已保存密码。出于安全考虑，API 只返回“已配置”，不会把原密码发回浏览器。':'尚未保存密码。输入后点击保存即可写入树莓派。';serviceState.innerHTML=`进程：<strong class="${svc.active?'ok':'error'}">${esc(svc.status||'未知')}</strong>　开机启动：${esc(svc.enabled||'未知')}`;const p=s.progress||{},n=s.last_counts||{},ds=s.detail_stats||{},ls=s.location_stats||{};state.className=`status ${s.status||''}`;state.textContent=`状态：${s.status||'未知'}\n搜索模式：${s.run_mode||'-'}\n当前步骤：${p.message||'-'}\n步骤代码：${p.step||'-'}\n目录页码：${p.page||'-'}\n目前发现：${p.discovered??'-'} 条\n开始：${s.last_started_at||'-'}\n结束：${s.last_finished_at||'-'}\n目录：${n.total??'-'}，新增：${n.added??'-'}，更新：${n.updated??'-'}，下架：${n.delisted??'-'}\n详情：计划 ${ds.planned??'-'}，保存 ${ds.saved??'-'}，失败 ${ds.failed??'-'}\n定位：待处理 ${ls.total??'-'}，成功 ${ls.located??'-'}，缓存复用 ${ls.cached??'-'}，未定位 ${ls.failed??'-'}\n错误：${s.last_error||'-'}`;const logs=s.run_log||[];liveLog.textContent=logs.map(x=>`[${x.at||''}] ${x.message||x.step||''}${x.url?'\n  '+x.url:''}`).join('\n')||'尚无运行日志';if(logs.length!==lastLogCount){liveLog.scrollTop=liveLog.scrollHeight;lastLogCount=logs.length;}changes.innerHTML=(d.recent_changes||[]).map(x=>`<div class="change"><strong>${esc(x.change)} · ${esc(x.rental_type)} · ID ${esc(x.id)}</strong><br><span class="muted">${esc(x.recorded_at||'')}</span><br><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a></div>`).join('')||'最近 8 小时暂无变化';}
async function load(){try{render(await api('/1/api/housing'))}catch(e){note(e.message,true)}}
async function save(){try{await api('/1/api/housing','POST',{incremental_interval_minutes:Number(incrementalInterval.value),full_interval_minutes:Number(fullInterval.value),username:username.value,password:password.value,clear_password:clearPassword.checked,email_enabled:emailEnabled.checked,notification_emails:notificationEmails.value,notify_added_types:[...document.querySelectorAll('[name=addedType]:checked')].map(x=>x.value),notify_delisted_types:[...document.querySelectorAll('[name=delistedType]:checked')].map(x=>x.value)});password.value='';clearPassword.checked=false;editing=false;note('当前设置已保存，两套调度周期将在下一轮生效');await load()}catch(e){note(e.message,true)}}
async function runNow(mode){try{const d=await api('/1/api/housing/run','POST',{mode});note(d.message)}catch(e){note(e.message,true)}}
async function resendNotification(){const button=document.getElementById('resendButton');button.disabled=true;try{const d=await api('/1/api/housing/resend-notification','POST',{});note(d.message)}catch(e){note(e.message,true)}finally{button.disabled=false}}
async function initializeHousing(){if(!confirm('初始化会永久清除房源、变化和运行历史。地理编码缓存、登录设置和账号密码会保留。确定继续吗？'))return;if(!confirm('初始化后会立即进行一次全量搜索，并把所有结果设为“未变化（复用）”。再次确认执行？'))return;const button=document.getElementById('initializeButton');button.disabled=true;try{const d=await api('/1/api/housing/initialize','POST',{confirm:true});note(d.message)}catch(e){note(e.message,true)}finally{button.disabled=false}}
function refreshResult(){resultFrame.src='/1/housing/result?t='+Date.now()}
document.querySelectorAll('input').forEach(x=>x.addEventListener('input',()=>editing=true));
load();setInterval(load,1000);
</script></body></html>
