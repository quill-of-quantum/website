<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAS 管理</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    .badge-ok { background:#dcfce7; color:#166534; border-color:#bbf7d0; }
    .badge-warn { background:#fef3c7; color:#92400e; border-color:#fde68a; }
    .badge-bad { background:#fee2e2; color:#991b1b; border-color:#fecaca; }
    .mini { font-size:12px; color:#6b7280; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>
<body>
  <div class="page">
    <div class="container">
      <div class="page-header">
        <h1>NAS 管理</h1>
        <p>树莓派 5 · Samba · 硬盘管理</p>
      </div>

      <div class="toolbar" style="justify-content:space-between;">
        <div class="toolbar">
          <a class="btn" href="/1/">返回管理面板</a>
          <button class="btn" onclick="loadStatus()">刷新</button>
        </div>
        <button class="btn" onclick="authManager.doLogout()">退出登录</button>
      </div>

      <div class="card">
        <h2 class="card-title">Samba 服务</h2>
        <div id="samba_status" class="muted">加载中...</div>
        <div class="toolbar" style="margin-top:12px;">
          <button class="btn" onclick="serviceAction('smbd','start')">启动 smbd</button>
          <button class="btn" onclick="serviceAction('smbd','stop')">停止 smbd</button>
          <button class="btn" onclick="serviceAction('smbd','restart')">重启 smbd</button>
          <button class="btn" onclick="serviceAction('smbd','reload')">重载 smbd</button>
          <button class="btn" onclick="serviceAction('nmbd','start')">启动 nmbd</button>
          <button class="btn" onclick="serviceAction('nmbd','stop')">停止 nmbd</button>
          <button class="btn" onclick="serviceAction('nmbd','restart')">重启 nmbd</button>
          <button class="btn" onclick="ensureInclude()">写入 include</button>
          <button class="btn" onclick="reloadSamba()">写入配置并重载</button>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">硬盘与挂载</h2>
        <div id="disk_info" class="muted">加载中...</div>
        <div class="section">
          <div class="section-title">挂载操作</div>
          <div class="grid-2">
            <div class="stack">
              <input id="mount_device" class="input" placeholder="设备路径，如 /dev/sda1">
              <input id="mount_point" class="input" placeholder="挂载点，如 /mnt/nas">
              <input id="mount_fstype" class="input" placeholder="文件系统类型，如 ext4 (可选)">
              <button class="btn btn-primary" onclick="doMount()">挂载</button>
            </div>
            <div class="stack">
              <input id="umount_target" class="input" placeholder="卸载目标，如 /mnt/nas 或 /dev/sda1">
              <button class="btn btn-danger" onclick="doUmount()">卸载</button>
              <div class="mini">提示：初始化/格式化请在命令行完成，本页面不提供格式化。</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">用户管理</h2>
        <div id="user_list" class="muted">加载中...</div>
        <div class="section">
          <div class="section-title">创建用户</div>
          <div class="grid-2">
            <input id="new_user" class="input" placeholder="用户名">
            <input id="new_pass" class="input" placeholder="密码" type="password">
          </div>
          <div class="toolbar" style="margin-top:10px;">
            <label class="mini"><input id="new_is_admin" type="checkbox"> 设为主账户</label>
            <button class="btn btn-primary" onclick="createUser()">创建</button>
          </div>
        </div>
        <div class="section">
          <div class="section-title">修改密码</div>
          <div class="grid-2">
            <input id="pwd_user" class="input" placeholder="用户名">
            <input id="pwd_pass" class="input" placeholder="新密码" type="password">
          </div>
          <div class="toolbar" style="margin-top:10px;">
            <button class="btn" onclick="updatePassword()">更新密码</button>
            <button class="btn btn-danger" onclick="deleteUser()">删除用户</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">共享管理</h2>
        <div id="share_list" class="muted">加载中...</div>
        <div class="section">
          <div class="section-title">创建共享</div>
          <div class="grid-2">
            <input id="share_name" class="input" placeholder="共享名，如 data">
            <input id="share_path" class="input" placeholder="路径，如 /mnt/nas/data">
            <input id="share_comment" class="input" placeholder="备注 (可选)">
            <input id="share_valid_users" class="input" placeholder="允许用户(逗号分隔)">
            <input id="share_admin_users" class="input" placeholder="管理员用户(逗号分隔)">
            <input id="share_write_list" class="input" placeholder="可写用户(逗号分隔)">
            <input id="share_create_mask" class="input" placeholder="create mask，如 0664">
            <input id="share_directory_mask" class="input" placeholder="directory mask，如 0775">
          </div>
          <div class="toolbar" style="margin-top:10px;">
            <label class="mini"><input id="share_read_only" type="checkbox"> 只读</label>
            <label class="mini"><input id="share_guest_ok" type="checkbox"> 访客可访问</label>
            <button class="btn btn-primary" onclick="createShare()">创建共享</button>
          </div>
        </div>
        <div class="section">
          <div class="section-title">更新/删除共享</div>
          <div class="grid-2">
            <input id="share_edit_name" class="input" placeholder="共享名">
            <input id="share_edit_path" class="input" placeholder="新路径 (可选)">
            <input id="share_edit_valid_users" class="input" placeholder="新允许用户(逗号分隔)">
            <input id="share_edit_admin_users" class="input" placeholder="新管理员用户(逗号分隔)">
            <input id="share_edit_write_list" class="input" placeholder="新可写用户(逗号分隔)">
            <input id="share_edit_comment" class="input" placeholder="新备注 (可选)">
          </div>
          <div class="toolbar" style="margin-top:10px;">
            <label class="mini"><input id="share_edit_read_only" type="checkbox"> 只读</label>
            <label class="mini"><input id="share_edit_guest_ok" type="checkbox"> 访客可访问</label>
            <button class="btn" onclick="updateShare()">更新共享</button>
            <button class="btn btn-danger" onclick="deleteShare()">删除共享</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">权限与休眠</h2>
        <div class="grid-2">
          <div class="stack">
            <div class="section-title">目录权限</div>
            <input id="perm_path" class="input" placeholder="路径，如 /mnt/nas/data">
            <input id="perm_owner" class="input" placeholder="owner，如 nasadmin (可选)">
            <input id="perm_group" class="input" placeholder="group，如 sambashare (可选)">
            <input id="perm_mode" class="input" placeholder="mode，如 0775 (可选)">
            <button class="btn" onclick="setPermissions()">应用权限</button>
          </div>
          <div class="stack">
            <div class="section-title">硬盘休眠</div>
            <input id="sleep_device" class="input" placeholder="设备路径，如 /dev/sda">
            <input id="sleep_minutes" class="input" placeholder="分钟数，0=关闭休眠">
            <button class="btn" onclick="setSleep()">设置休眠</button>
            <div class="mini">说明：休眠值会转成 hdparm 的 -S 参数。</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">状态提示</h2>
        <div id="status_note" class="muted">等待操作...</div>
      </div>

    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    function note(msg, isError=false) {
      const el = document.getElementById('status_note');
      el.textContent = msg;
      el.style.color = isError ? '#991b1b' : '#6b7280';
    }

    function apiFetch(url, method='GET', data=null) {
      const options = { method, headers: { 'Content-Type': 'application/json' } };
      if (data) options.body = JSON.stringify(data);
      return fetch(url, options).then(r => r.json()).then(data => {
        if (data && data.require_login) {
          window.location.href = '/';
          return Promise.reject(new Error('login required'));
        }
        return data;
      });
    }

    function badge(status) {
      const s = String(status || '').toLowerCase();
      if (s.startsWith('active')) return '<span class="badge badge-ok">active</span>';
      if (s.startsWith('inactive') || s.startsWith('failed')) return '<span class="badge badge-bad">' + status + '</span>';
      if (s.includes('activating') || s.includes('deactivating')) return '<span class="badge badge-warn">' + status + '</span>';
      return '<span class="badge">' + (status || 'unknown') + '</span>';
    }

    function renderSambaStatus(data) {
      const svc = data.samba && data.samba.service ? data.samba.service : {};
      const includeOk = data.samba && data.samba.include_ok;
      const includeMsg = data.samba && data.samba.include_msg;
      const users = (data.samba && data.samba.samba_users) || [];
      const usersErr = data.samba && data.samba.samba_users_err;
      return `
        <div>SMBD: ${badge(svc.smbd)}</div>
        <div>NMBD: ${badge(svc.nmbd)}</div>
        <div>配置 include: <span class="badge ${includeOk ? 'badge-ok' : 'badge-warn'}">${includeOk ? '已启用' : '未启用'}</span> <span class="mini">${includeMsg || ''}</span></div>
        <div class="mini">Samba 用户: ${users.length ? users.join(', ') : (usersErr ? '读取失败' : '暂无')}</div>
      `;
    }

    function renderDisks(data) {
      if (!data.disks) return `<div>读取失败：${data.disks_err || 'unknown'}</div>`;
      const devs = (data.disks.blockdevices || []).map(d => {
        const mp = d.mountpoint || '';
        return `<tr><td class="mono">${d.name}</td><td>${d.type}</td><td>${d.fstype || ''}</td><td>${d.size || ''}</td><td>${mp}</td><td>${d.label || ''}</td></tr>`;
      }).join('');
      return `
        <div class="mini">lsblk</div>
        <table class="table">
          <thead><tr><th>设备</th><th>类型</th><th>文件系统</th><th>大小</th><th>挂载点</th><th>标签</th></tr></thead>
          <tbody>${devs || '<tr><td colspan="6">暂无设备</td></tr>'}</tbody>
        </table>
      `;
    }

    function renderUsers(state, sambaUsers) {
      const users = state.users || {};
      const rows = Object.keys(users).map(name => {
        const isAdmin = users[name] && users[name].is_admin;
        const tag = isAdmin ? '<span class="badge badge-ok">主账户</span>' : '';
        const inSamba = (sambaUsers || []).includes(name) ? '<span class="badge">samba</span>' : '<span class="badge badge-warn">未同步</span>';
        return `<tr><td class="mono">${name}</td><td>${tag}</td><td>${inSamba}</td></tr>`;
      }).join('');
      return `
        <table class="table">
          <thead><tr><th>用户名</th><th>主账户</th><th>状态</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="3">暂无用户</td></tr>'}</tbody>
        </table>
      `;
    }

    function renderShares(state) {
      const shares = state.shares || {};
      const rows = Object.keys(shares).map(name => {
        const s = shares[name] || {};
        return `<tr>
          <td class="mono">${name}</td>
          <td class="mono">${s.path || ''}</td>
          <td>${s.read_only ? '只读' : '可写'}</td>
          <td>${s.guest_ok ? '是' : '否'}</td>
          <td>${(s.valid_users || []).join(', ')}</td>
          <td>${(s.admin_users || []).join(', ')}</td>
        </tr>`;
      }).join('');
      return `
        <table class="table">
          <thead><tr><th>共享名</th><th>路径</th><th>读写</th><th>访客</th><th>允许用户</th><th>管理员用户</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6">暂无共享</td></tr>'}</tbody>
        </table>
      `;
    }

    function loadStatus() {
      apiFetch('/1/api/nas/status').then(data => {
        if (!data.ok) throw new Error(data.error || 'load failed');
        document.getElementById('samba_status').innerHTML = renderSambaStatus(data);
        document.getElementById('disk_info').innerHTML = renderDisks(data);
        document.getElementById('user_list').innerHTML = renderUsers(data.state || {}, data.samba ? data.samba.samba_users : []);
        document.getElementById('share_list').innerHTML = renderShares(data.state || {});
        note('状态已更新');
      }).catch(err => note('加载失败: ' + err.message, true));
    }

    function serviceAction(service, action) {
      apiFetch('/1/api/nas/service', 'POST', { service, action }).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('服务操作成功');
        loadStatus();
      }).catch(err => note('服务操作失败: ' + err.message, true));
    }

    function ensureInclude() {
      apiFetch('/1/api/nas/include', 'POST', {}).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('include 已处理: ' + (data.result || 'ok'));
        loadStatus();
      }).catch(err => note('include 处理失败: ' + err.message, true));
    }

    function reloadSamba() {
      apiFetch('/1/api/nas/reload', 'POST', {}).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('配置写入并重载完成');
        loadStatus();
      }).catch(err => note('重载失败: ' + err.message, true));
    }

    function createUser() {
      const username = document.getElementById('new_user').value.trim();
      const password = document.getElementById('new_pass').value;
      const isAdmin = document.getElementById('new_is_admin').checked;
      apiFetch('/1/api/nas/users/create', 'POST', { username, password, is_admin: isAdmin }).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('用户创建成功');
        loadStatus();
      }).catch(err => note('创建失败: ' + err.message, true));
    }

    function deleteUser() {
      const username = document.getElementById('pwd_user').value.trim();
      apiFetch('/1/api/nas/users/delete', 'POST', { username }).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('用户已删除');
        loadStatus();
      }).catch(err => note('删除失败: ' + err.message, true));
    }

    function updatePassword() {
      const username = document.getElementById('pwd_user').value.trim();
      const password = document.getElementById('pwd_pass').value;
      apiFetch('/1/api/nas/users/password', 'POST', { username, password }).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('密码已更新');
      }).catch(err => note('更新失败: ' + err.message, true));
    }

    function createShare() {
      const payload = {
        name: document.getElementById('share_name').value.trim(),
        path: document.getElementById('share_path').value.trim(),
        comment: document.getElementById('share_comment').value.trim(),
        valid_users: document.getElementById('share_valid_users').value.trim(),
        admin_users: document.getElementById('share_admin_users').value.trim(),
        write_list: document.getElementById('share_write_list').value.trim(),
        create_mask: document.getElementById('share_create_mask').value.trim(),
        directory_mask: document.getElementById('share_directory_mask').value.trim(),
        read_only: document.getElementById('share_read_only').checked,
        guest_ok: document.getElementById('share_guest_ok').checked
      };
      apiFetch('/1/api/nas/shares/create', 'POST', payload).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('共享已创建');
        loadStatus();
      }).catch(err => note('创建共享失败: ' + err.message, true));
    }

    function updateShare() {
      const payload = {
        name: document.getElementById('share_edit_name').value.trim(),
        path: document.getElementById('share_edit_path').value.trim(),
        comment: document.getElementById('share_edit_comment').value.trim(),
        valid_users: document.getElementById('share_edit_valid_users').value.trim(),
        admin_users: document.getElementById('share_edit_admin_users').value.trim(),
        write_list: document.getElementById('share_edit_write_list').value.trim(),
        read_only: document.getElementById('share_edit_read_only').checked,
        guest_ok: document.getElementById('share_edit_guest_ok').checked
      };
      apiFetch('/1/api/nas/shares/update', 'POST', payload).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('共享已更新');
        loadStatus();
      }).catch(err => note('更新共享失败: ' + err.message, true));
    }

    function deleteShare() {
      const name = document.getElementById('share_edit_name').value.trim();
      apiFetch('/1/api/nas/shares/delete', 'POST', { name }).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('共享已删除');
        loadStatus();
      }).catch(err => note('删除共享失败: ' + err.message, true));
    }

    function setPermissions() {
      const payload = {
        path: document.getElementById('perm_path').value.trim(),
        owner: document.getElementById('perm_owner').value.trim(),
        group: document.getElementById('perm_group').value.trim(),
        mode: document.getElementById('perm_mode').value.trim()
      };
      apiFetch('/1/api/nas/permissions', 'POST', payload).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('权限已应用');
      }).catch(err => note('权限设置失败: ' + err.message, true));
    }

    function setSleep() {
      const payload = {
        device: document.getElementById('sleep_device').value.trim(),
        minutes: document.getElementById('sleep_minutes').value.trim()
      };
      apiFetch('/1/api/nas/sleep', 'POST', payload).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('休眠已设置，hdparm -S=' + data.hdparm_value);
      }).catch(err => note('休眠设置失败: ' + err.message, true));
    }

    function doMount() {
      const payload = {
        device: document.getElementById('mount_device').value.trim(),
        mount_point: document.getElementById('mount_point').value.trim(),
        fs_type: document.getElementById('mount_fstype').value.trim()
      };
      apiFetch('/1/api/nas/mount', 'POST', payload).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('挂载完成');
        loadStatus();
      }).catch(err => note('挂载失败: ' + err.message, true));
    }

    function doUmount() {
      const payload = { target: document.getElementById('umount_target').value.trim() };
      apiFetch('/1/api/nas/umount', 'POST', payload).then(data => {
        if (!data.ok) throw new Error(data.error || 'failed');
        note('卸载完成');
        loadStatus();
      }).catch(err => note('卸载失败: ' + err.message, true));
    }

    document.addEventListener('DOMContentLoaded', function() {
      authManager.createLoginStatusWidget();
      authManager.checkLoginStatus();
      loadStatus();
    });
  </script>
</body>
</html>
