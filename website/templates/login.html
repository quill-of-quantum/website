<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Admin Login</title>
</head>
<body>
  <h2>管理员登录</h2>

  <p>当前访问 IP: {{ ip }}</p>  <!-- 显示访问者 IP -->

  {% if error %}
    <p style="color:red">{{error}}</p>
  {% endif %}

  <form method="POST">
    <label>用户名:</label><br>
    <input name="username" required><br>

    <label>密码:</label><br>
    <input type="password" name="password" required><br><br>

    <button type="submit">登录</button>
  </form>
</body>
</html>
