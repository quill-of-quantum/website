<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📂 云盘 - 文件上传</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-normalize/modern-normalize.min.css">
  <style>
    .file-list {
      margin-top: 1rem;
      user-select: none;
    }
    .file-list.selection-active {
      user-select: none;
      cursor: default;
    }
    .file-item {
      background: #f8fafc;
      margin: 4px 0;
      padding: 8px 10px;
      border-radius: var(--r);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      border: 1px solid transparent;
      position: relative;
      transition: background-color 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .file-item:hover {
      background: #f1f5f9;
    }
    .file-item.selected {
      background: var(--primary-weak);
      border-color: #93c5fd;
      box-shadow: inset 3px 0 0 var(--primary);
    }
    .file-item:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .selection-box {
      position: fixed;
      z-index: 1000;
      pointer-events: none;
      border: 1px solid var(--primary);
      background: rgba(37, 99, 235, 0.13);
      border-radius: 3px;
    }
    .selection-help {
      color: var(--muted);
      font-size: 0.82rem;
      margin: 0.45rem 0 0;
    }
    .file-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
    }
    .thumbnail {
      width: 40px;
      height: 40px;
      border-radius: var(--r-sm);
      object-fit: cover;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .thumbnail:hover {
      transform: scale(1.1);
      border-color: var(--primary);
    }
    .file-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef2f7;
      border-radius: var(--r-sm);
      font-size: 1.2rem;
    }
    a { text-decoration: none; color: var(--primary); margin-right: 0.5rem; }
    #uploadStatus { margin-top: 1rem; font-size: 0.95rem; }
    .disk-info {
      margin-top: 1rem;
      background: #f3f6ff;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    progress {
      width: 100%;
      height: 18px;
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
      appearance: none;
    }
    progress::-webkit-progress-bar {
      background-color: #eee;
      border-radius: 10px;
    }
    progress::-webkit-progress-value {
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      border-radius: 10px;
    }
    .sort-controls {
      margin-bottom: 1rem;
      padding: 0.8rem;
      background: #f8fafc;
      border-radius: var(--r);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .sort-controls button {
      padding: 6px 10px;
      font-size: 13px;
      background: #fff;
      border: 1px solid var(--border);
      margin: 0;
    }
    .sort-controls button.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="container card">
      <div class="page-header">
        <h1>📂 云盘 - 文件上传</h1>
        <p>可上传任意文件，系统将保存到服务器，可在下方下载或删除。</p>
      </div>

      <div class="toolbar">
        <input type="file" id="fileInput" multiple style="display:none;" />
        <button class="btn btn-primary" id="uploadBtn">选择文件</button>
        <a class="btn btn-ghost" href="/">🏠 返回首页</a>
      </div>

      <progress id="progressBar" value="0" max="100" style="display:none;"></progress>
      <div id="speedText" style="margin-top:0.5rem;font-size:0.9rem;color:#555;"></div>
      <div id="uploadStatus"></div>

      <div id="diskInfo" class="disk-info">💾 正在获取存储空间信息...</div>

      <h2 class="section-title">📋 已上传文件</h2>
    
      <!-- 排序控制 -->
      <div class="sort-controls">
        <span>排序方式：</span>
        <button id="sortByTime" class="active">⏰ 时间</button>
        <button id="sortByName">📁 类型+名称</button>
        <span style="margin-left: 1rem;">排序：</span>
        <button id="orderDesc" class="active">⬇️ 降序</button>
        <button id="orderAsc">⬆️ 升序</button>
      </div>
      <p class="selection-help">提示：单击选择；Ctrl/⌘ 点击多选；Shift 点击连续选择；在列表空白处拖动可框选。</p>
    
      <div id="fileList" class="file-list" role="listbox" aria-multiselectable="true"></div>
    </div>
  </div>

  <!-- 引入统一的认证模块 -->
  <script src="/static/js/auth.js"></script>

  <script>
  const statusDiv = document.getElementById("uploadStatus");
  const diskDiv = document.getElementById("diskInfo");
  const progressBar = document.getElementById("progressBar");
  const speedText = document.getElementById("speedText");

  let selectedFiles = new Map();
  let totalFiles = [];
  let imageFiles = [];
  let currentImageIndex = -1;
  let keyListenerAttached = false;
  let selectionAnchor = null;
  let marqueeState = null;
  let suppressItemClick = false;

  let currentSort = "time";
  let currentOrder = "desc";

  // 初始化认证系统
  document.addEventListener('DOMContentLoaded', function() {
    authManager.createLoginStatusWidget();
    authManager.checkLoginStatus();
  });

  // --- 格式化大小 ---
  function formatSize(mb) {
    return mb >= 1024 ? (mb / 1024).toFixed(2) + " GB" : mb.toFixed(2) + " MB";
  }

  // --- 格式化时间 ---
  function formatTime(timestamp) {
    return new Date(timestamp * 1000).toLocaleString('zh-CN', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  // --- 获取文件类型显示名称 ---
  function getFileTypeDisplay(ext, name) {
    const imageExts = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp', '.svg'];
    const videoExts = ['.mp4', '.avi', '.mov', '.wmv', '.flv', '.mkv'];
    const docExts = ['.txt', '.doc', '.docx', '.pdf', '.xls', '.xlsx', '.ppt', '.pptx'];
    const codeExts = ['.js', '.html', '.css', '.py', '.java', '.cpp', '.c'];
    
    if (imageExts.includes(ext)) return '🖼️ 图片';
    if (videoExts.includes(ext)) return '🎥 视频';
    if (docExts.includes(ext)) return '📄 文档';
    if (codeExts.includes(ext)) return '💻 代码';
    return '📎 其他';
  }

  // --- 更新选中信息 ---
  function updateSelectionInfo() {
    const info = document.getElementById("selectionInfo");
    const count = selectedFiles.size;
    const totalMB = [...selectedFiles.values()].reduce((a, b) => a + b.size, 0);
    info.textContent = count
      ? `已选择 ${count} 个文件，共 ${formatSize(totalMB)}`
      : "未选择文件";
    document.querySelectorAll(".file-item").forEach(item => {
      const selected = selectedFiles.has(item.dataset.name);
      item.classList.toggle("selected", selected);
      item.setAttribute("aria-selected", String(selected));
      const checkbox = item.querySelector(".file-checkbox");
      if (checkbox) checkbox.checked = selected;
    });
  }

  function fileDataAt(index) {
    const f = totalFiles[index];
    if (!f) return null;
    return {
      name: f.stored_name,
      size: parseFloat(f.size),
      display: f.display_name
    };
  }

  function selectIndex(index, selected = true) {
    const file = fileDataAt(index);
    if (!file) return;
    if (selected) selectedFiles.set(file.name, { size: file.size, display: file.display });
    else selectedFiles.delete(file.name);
  }

  function selectRange(from, to, additive = false) {
    if (!additive) selectedFiles.clear();
    const start = Math.min(from, to);
    const end = Math.max(from, to);
    for (let i = start; i <= end; i++) selectIndex(i);
  }

  function handleItemSelection(index, event) {
    const additive = event.ctrlKey || event.metaKey;
    if (event.shiftKey && selectionAnchor !== null) {
      selectRange(selectionAnchor, index, additive);
    } else if (additive) {
      const file = fileDataAt(index);
      selectIndex(index, !selectedFiles.has(file.name));
      selectionAnchor = index;
    } else {
      selectedFiles.clear();
      selectIndex(index);
      selectionAnchor = index;
    }
    updateSelectionInfo();
  }

  function beginMarquee(event) {
    if (event.pointerType !== "mouse" || event.button !== 0 || event.target.closest("button, a, input, .thumbnail")) return;
    const list = document.getElementById("fileList");
    const box = document.createElement("div");
    box.className = "selection-box";
    box.style.display = "none";
    document.body.appendChild(box);
    marqueeState = {
      startX: event.clientX,
      startY: event.clientY,
      additive: event.ctrlKey || event.metaKey || event.shiftKey,
      initial: new Set(selectedFiles.keys()),
      dragging: false,
      box
    };
    window.addEventListener("pointermove", updateMarquee);
    window.addEventListener("pointerup", endMarquee, { once: true });
    window.addEventListener("pointercancel", endMarquee, { once: true });
  }

  function updateMarquee(event) {
    if (!marqueeState) return;
    const distance = Math.hypot(event.clientX - marqueeState.startX, event.clientY - marqueeState.startY);
    if (!marqueeState.dragging && distance < 5) return;
    if (!marqueeState.dragging) {
      marqueeState.dragging = true;
      marqueeState.box.style.display = "block";
      document.getElementById("fileList").classList.add("selection-active");
      if (!marqueeState.additive) selectedFiles.clear();
    }
    const left = Math.min(marqueeState.startX, event.clientX);
    const top = Math.min(marqueeState.startY, event.clientY);
    const right = Math.max(marqueeState.startX, event.clientX);
    const bottom = Math.max(marqueeState.startY, event.clientY);
    Object.assign(marqueeState.box.style, {
      left: `${left}px`, top: `${top}px`, width: `${right - left}px`, height: `${bottom - top}px`
    });

    selectedFiles.clear();
    if (marqueeState.additive) {
      marqueeState.initial.forEach(name => {
        const index = totalFiles.findIndex(file => file.stored_name === name);
        if (index >= 0) selectIndex(index);
      });
    }
    document.querySelectorAll(".file-item").forEach(item => {
      const rect = item.getBoundingClientRect();
      const intersects = rect.left < right && rect.right > left && rect.top < bottom && rect.bottom > top;
      if (intersects) selectIndex(Number(item.dataset.index));
    });
    updateSelectionInfo();
  }

  function endMarquee() {
    if (!marqueeState) return;
    const wasDragging = marqueeState.dragging;
    marqueeState.box.remove();
    marqueeState = null;
    document.getElementById("fileList").classList.remove("selection-active");
    window.removeEventListener("pointermove", updateMarquee);
    window.removeEventListener("pointerup", endMarquee);
    window.removeEventListener("pointercancel", endMarquee);
    if (wasDragging) {
      suppressItemClick = true;
      setTimeout(() => { suppressItemClick = false; }, 0);
    }
  }

  // --- 判断是否图片文件 ---
  function isImageFile(name) {
    return /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/i.test(name);
  }

  // --- 显示图片预览弹窗 ---
  function openImageViewer(index) {
    currentImageIndex = index;
    const overlay = document.getElementById("imageOverlay");
    const img = document.getElementById("previewImage");
    const caption = document.getElementById("imageCaption");

    const f = imageFiles[index];
    const storedName = f.stored_name || f.name;
    const displayName = f.display_name || f.original_name || f.name;
    img.src = `/uploads/${encodeURIComponent(storedName)}`;
    caption.textContent = `${displayName} (${f.size})`;

    overlay.style.display = "flex";
    attachViewerKeyListener();
  }

  // --- 关闭预览 ---
  function closeViewer() {
    document.getElementById("imageOverlay").style.display = "none";
  }

  // --- 上一张/下一张 ---
  function prevImage() {
    if (currentImageIndex <= 0)
      currentImageIndex = imageFiles.length - 1;
    else currentImageIndex--;
    openImageViewer(currentImageIndex);
  }

  function nextImage() {
    if (currentImageIndex >= imageFiles.length - 1)
      currentImageIndex = 0;
    else currentImageIndex++;
    openImageViewer(currentImageIndex);
  }

  function attachViewerKeyListener() {
    if (keyListenerAttached) return;
    keyListenerAttached = true;
    document.addEventListener("keydown", handleViewerKeys);
  }

  function handleViewerKeys(e) {
    const overlay = document.getElementById("imageOverlay");
    if (!overlay || overlay.style.display !== "flex") return;
    if (e.key === "Escape") {
      e.preventDefault();
      closeViewer();
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      prevImage();
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      nextImage();
    }
  }

  // --- 加载文件列表 ---
  async function loadFiles() {
    const res = await fetch(`/api/cloud/files?sort=${currentSort}&order=${currentOrder}`);
    const data = await res.json();
    totalFiles = data.files || [];
    totalFiles.forEach(f => {
      f.display_name = f.display_name || f.original_name || f.name;
      f.stored_name = f.stored_name || f.name;
    });
    imageFiles = totalFiles.filter(f => isImageFile(f.stored_name));

    if (data.disk) {
      const d = data.disk;
      diskDiv.textContent = `💾 存储使用：总容量 ${d.total}　已用 ${d.used}　剩余 ${d.free}`;
    }

    const list = document.getElementById("fileList");
    list.innerHTML = "";
    selectedFiles.forEach((_, name) => {
      if (!totalFiles.some(file => file.stored_name === name)) selectedFiles.delete(name);
    });

    const toolbar = document.createElement("div");
    toolbar.style.marginBottom = "0.8rem";
    toolbar.innerHTML = `
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:0.5rem;">
        <button class="btn btn-sm" id="selectAllBtn">全选</button>
        <button class="btn btn-sm" id="clearSelectBtn">取消全选</button>
        <button class="btn btn-sm btn-danger" id="batchDeleteBtn">批量删除</button>
        <button class="btn btn-sm" id="batchDownloadBtn">批量下载</button>
        <span id="selectionInfo" style="margin-left:auto;font-size:0.9rem;color:#444;">未选择文件</span>
      </div>
    `;
    list.appendChild(toolbar);

    data.files.forEach((f, idx) => {
      const div = document.createElement("div");
      div.className = "file-item";
      div.dataset.index = idx;
      div.dataset.name = f.stored_name || f.name;
      div.tabIndex = 0;
      div.setAttribute("role", "option");
      const storedName = f.stored_name || f.name;
      const displayName = f.display_name || f.original_name || f.name;
      const isImg = isImageFile(storedName);
      const timeStr = formatTime(f.create_time);
      const typeDisplay = getFileTypeDisplay(f.ext, storedName);

      // 生成缩略图或图标
      let thumbnailHtml = '';
      if (isImg && f.has_thumbnail) {
        thumbnailHtml = `<img class="thumbnail" src="/thumbnails/thumb_${encodeURIComponent(storedName)}" 
                         alt="${displayName}" onclick="openImageViewer(${imageFiles.findIndex(im=>im.stored_name===storedName)})"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                         <div class="file-icon" style="display:none;">🖼️</div>`;
      } else {
        const iconMap = {
          '🖼️ 图片': '🖼️',
          '🎥 视频': '🎥',
          '📄 文档': '📄',
          '💻 代码': '💻',
          '📎 其他': '📎'
        };
        const icon = iconMap[typeDisplay] || '📄';
        thumbnailHtml = `<div class="file-icon">${icon}</div>`;
      }

      div.innerHTML = `
        <div class="file-info">
          <input type="checkbox" class="file-checkbox" data-name="${storedName}" data-display="${displayName}" data-size="${parseFloat(f.size)}">
          ${thumbnailHtml}
          <span>
            ${currentSort === "name" ? typeDisplay + " " : ""}${displayName}
            <small style="color:#777;">
              (${f.size}${currentSort === "time" ? " - " + timeStr : ""})
            </small>
          </span>
        </div>
        <span>
          <a href="/api/cloud/download/${encodeURIComponent(storedName)}">下载</a>
          ${isImg
            ? `<a href="javascript:void(0);" onclick="openImageViewer(${imageFiles.findIndex(im=>im.stored_name===storedName)})">查看</a>`
            : `<a href="/uploads/${encodeURIComponent(storedName)}" target="_blank">查看</a>`
          }
          <button class="btn btn-sm btn-danger" onclick="deleteFile('${storedName}','${displayName.replace(/'/g, "\\'")}')">删除</button>
        </span>`;
      list.appendChild(div);
      div.addEventListener("click", event => {
        if (suppressItemClick) {
          event.preventDefault();
          return;
        }
        if (event.target.closest("a, button, .thumbnail")) return;
        handleItemSelection(idx, event);
      });
      div.addEventListener("keydown", event => {
        if (event.target.closest("a, button, input")) return;
        if (event.key !== " " && event.key !== "Enter") return;
        event.preventDefault();
        handleItemSelection(idx, event);
      });
    });

    document.querySelectorAll(".file-checkbox").forEach(cb => {
      cb.addEventListener("click", event => {
        event.stopPropagation();
        const index = Number(event.target.closest(".file-item").dataset.index);
        handleItemSelection(index, {
          ctrlKey: !event.shiftKey,
          metaKey: false,
          shiftKey: event.shiftKey
        });
      });
    });

    document.getElementById("selectAllBtn").onclick = () => {
      selectedFiles.clear();
      selectionAnchor = totalFiles.length ? 0 : null;
      document.querySelectorAll(".file-checkbox").forEach(cb => {
        cb.checked = true;
        selectedFiles.set(cb.dataset.name, { size: parseFloat(cb.dataset.size), display: cb.dataset.display });
      });
      updateSelectionInfo();
    };

    document.getElementById("clearSelectBtn").onclick = () => {
      document.querySelectorAll(".file-checkbox").forEach(cb => (cb.checked = false));
      selectedFiles.clear();
      selectionAnchor = null;
      updateSelectionInfo();
    };

    document.getElementById("batchDeleteBtn").onclick = batchDelete;
    document.getElementById("batchDownloadBtn").onclick = batchDownload;

    updateSelectionInfo();
    list.addEventListener("pointerdown", beginMarquee);
  }

  document.addEventListener("keydown", event => {
    const overlay = document.getElementById("imageOverlay");
    if (overlay && overlay.style.display === "flex") return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "a") {
      event.preventDefault();
      selectedFiles.clear();
      totalFiles.forEach((_, index) => selectIndex(index));
      updateSelectionInfo();
    } else if (event.key === "Escape") {
      selectedFiles.clear();
      selectionAnchor = null;
      updateSelectionInfo();
    }
  });

  // --- 批量删除 ---
  async function batchDelete() {
    if (!authManager.requireLogin()) return;
    
    if (selectedFiles.size === 0) {
      alert("⚠️ 请先选择要删除的文件！");
      return;
    }
    const displayList = [...selectedFiles.values()].map(v => v.display).join("\n");
    if (!confirm(`确定删除以下 ${selectedFiles.size} 个文件吗？\n${displayList}`)) return;

    for (const name of selectedFiles.keys()) {
      try {
        const res = await fetch(`/api/cloud/delete/${encodeURIComponent(name)}`, { method: "POST" });
        const data = await res.json();
        
        if (res.status === 403 && data.require_login) {
          alert('需要登录后才能删除文件');
          authManager.showLoginModal();
          return;
        }
      } catch (e) {
        console.error(`删除 ${name} 失败:`, e);
      }
    }
    statusDiv.textContent = `🗑️ 已删除 ${selectedFiles.size} 个文件`;
    selectedFiles.clear();
    loadFiles();
  }

  // --- 批量下载 ---
  function batchDownload() {
    if (selectedFiles.size === 0) {
      alert("⚠️ 请先选择要下载的文件！");
      return;
    }
    [...selectedFiles.entries()].forEach(([name, info], i) => {
      setTimeout(() => {
        const a = document.createElement("a");
        a.href = `/api/cloud/download/${encodeURIComponent(name)}`;
        a.download = info.display || name;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }, i * 500);
    });
    statusDiv.textContent = `⬇️ 已开始下载 ${selectedFiles.size} 个文件`;
  }

  // --- 上传多个文件 ---
  async function uploadFilesSequential(files) {
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      await uploadSingleFile(file, i + 1, files.length);
    }
  }

  // --- 上传单个文件 ---
  function uploadSingleFile(file, index, total) {
    return new Promise((resolve, reject) => {
      const formData = new FormData();
      formData.append("file", file);

      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/cloud/upload");

      progressBar.value = 0;
      progressBar.style.display = "block";
      speedText.textContent = `📤 上传 ${index}/${total}：${file.name}`;

      let lastTime = performance.now();
      let lastLoaded = 0;

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const percent = (e.loaded / e.total) * 100;
          progressBar.value = percent;
          const now = performance.now();
          const deltaTime = (now - lastTime) / 1000;
          const deltaBytes = e.loaded - lastLoaded;
          if (deltaTime > 0.3) {
            const speedMBs = (deltaBytes / 1024 / 1024 / deltaTime).toFixed(2);
            speedText.textContent = `📤 上传 ${index}/${total}：${file.name}　速度：${speedMBs} MB/s`;
            lastTime = now;
            lastLoaded = e.loaded;
          }
        }
      };

      xhr.onload = () => {
        if (xhr.status === 200) {
          const res = JSON.parse(xhr.responseText);
          statusDiv.textContent = res.message || "✅ 上传完成";
        } else {
          statusDiv.textContent = `❌ 上传失败 (${xhr.status})`;
        }
        resolve();
        loadFiles();
      };

      xhr.onerror = () => {
        statusDiv.textContent = "❌ 上传出错";
        reject();
      };

      xhr.send(formData);
    });
  }

  // --- 上传入口 ---
  function uploadFile() {
    const input = document.getElementById("fileInput");
    const files = Array.from(input.files);
    if (!files.length) {
      statusDiv.textContent = "⚠️ 请先选择文件。";
      return;
    }

    statusDiv.textContent = `📤 正在上传 ${files.length} 个文件...`;
    progressBar.style.display = "block";
    progressBar.value = 0;
    speedText.textContent = "";

    uploadFilesSequential(files).then(() => {
      statusDiv.textContent = "✅ 全部文件上传完成。";
      progressBar.style.display = "none";
      speedText.textContent = "";
      input.value = "";
      document.getElementById("uploadBtn").textContent = "选择文件";
    });
  }

  // --- 修改删除单个文件函数 ---
  async function deleteFile(name, displayName) {
    if (!authManager.requireLogin()) return;
    
    const shown = displayName || name;
    if (!confirm(`确定删除 ${shown} 吗？`)) return;
    
    try {
      const res = await fetch(`/api/cloud/delete/${encodeURIComponent(name)}`, { method: "POST" });
      const data = await res.json();
      
      if (res.status === 403 && data.require_login) {
        alert('需要登录后才能删除文件');
        authManager.showLoginModal();
        return;
      }
      
      statusDiv.textContent = data.message;
      loadFiles();
    } catch (e) {
      statusDiv.textContent = `❌ 删除失败: ${e.message}`;
    }
  }

  // --- 排序事件监听器 ---
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById("sortByTime").addEventListener("click", () => {
      currentSort = "time";
      updateSortButtons();
      loadFiles();
    });
    
    document.getElementById("sortByName").addEventListener("click", () => {
      currentSort = "name";
      updateSortButtons();
      loadFiles();
    });
    
    document.getElementById("orderDesc").addEventListener("click", () => {
      currentOrder = "desc";
      updateSortButtons();
      loadFiles();
    });
    
    document.getElementById("orderAsc").addEventListener("click", () => {
      currentOrder = "asc";
      updateSortButtons();
      loadFiles();
    });
  });

  // --- 更新排序按钮状态 ---
  function updateSortButtons() {
    document.getElementById("sortByTime").classList.toggle("active", currentSort === "time");
    document.getElementById("sortByName").classList.toggle("active", currentSort === "name");
    document.getElementById("orderDesc").classList.toggle("active", currentOrder === "desc");
    document.getElementById("orderAsc").classList.toggle("active", currentOrder === "asc");
  }

  document.getElementById("uploadBtn").addEventListener("click", () => {
    const input = document.getElementById("fileInput");
    if (input.files.length === 0) {
      input.click();
    } else {
      uploadFile();
    }
  });

  document.getElementById("fileInput").addEventListener("change", function() {
    const btn = document.getElementById("uploadBtn");
    if (this.files.length > 0) {
      btn.textContent = `上传 (${this.files.length} 个文件)`;
      statusDiv.textContent = `已选择 ${this.files.length} 个文件，点击“上传”开始。`;
    } else {
      btn.textContent = "选择文件";
      statusDiv.textContent = "";
    }
  });

  loadFiles();
</script>
