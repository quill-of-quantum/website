<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备数据库</title><link rel="stylesheet" href="/static/css/base.css"><style>
.packet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.packet{border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;background:#fff}.packet:hover{border-color:#93c5fd}.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;background:#eef2ff;color:#3730a3;margin:2px}.deleted{background:#fee2e2;color:#991b1b}.detail{display:none}.category{border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:14px}.category-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.records{display:grid;gap:8px;margin-top:10px}.record{background:#f8fafc;border-radius:8px;padding:10px;display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:12px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:10px}.photo{border:1px solid var(--border);border-radius:10px;overflow:hidden}.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.photo div{padding:8px;font-size:12px;color:var(--muted)}@media(max-width:600px){.record{grid-template-columns:1fr}}
</style></head><body><div class="page"><div class="container"><div class="page-header"><h1>设备数据库</h1><p>设备删除后，数据包仍会保留，直到在这里手动删除。</p></div>
<div class="toolbar"><a class="btn" href="/1/devices">返回设备管理</a><a class="btn" href="/1/">返回管理面板</a><button class="btn" id="refresh">刷新</button><span id="status" class="muted"></span></div>
<div class="card"><h2 class="card-title">设备数据包</h2><div id="packets" class="packet-grid">加载中...</div></div>
<div class="card detail" id="detail"><div class="category-head"><div><h2 class="card-title" id="detail-title"></h2><div id="detail-meta" class="muted"></div></div><button class="btn btn-danger" id="delete-packet">删除整个数据包</button></div><div id="categories"></div></div>
</div></div><script src="/static/js/auth.js"></script><script>
let packets=[],selectedPacket=null;
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const fmt=value=>value?new Date(Number(value)*1000).toLocaleString():'-';
const api=async(url,options={})=>{const response=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败');return data};
function packetCard(packet){const badges=(packet.categories||[]).map(item=>`<span class="pill">${esc(item.label)} ${item.count}</span>`).join('');return `<div class="packet" onclick="openPacket('${esc(packet.packet_id)}')"><div><strong>${esc(packet.device_name)}</strong> ${packet.device_deleted_at?'<span class="pill deleted">设备已删除</span>':''}</div><div class="muted">${esc(packet.device_id)} · ${esc(packet.device_type)}</div><div style="margin-top:8px">${badges||'<span class="muted">暂无数据</span>'}</div><div class="muted" style="margin-top:6px">共 ${Number(packet.record_count||0)} 条</div></div>`}
async function loadPackets(){document.getElementById('status').textContent='加载中...';try{const result=await api('/1/api/devices/database/packets');packets=result.packets||[];document.getElementById('packets').innerHTML=packets.map(packetCard).join('')||'<span class="muted">暂无设备数据包</span>';document.getElementById('status').textContent=`共 ${packets.length} 个数据包`}catch(error){document.getElementById('status').textContent=`加载失败：${error.message}`}}
function normalRecords(records){return `<div class="records">${records.map(record=>`<div class="record"><div class="muted">${esc(record.measured_at)}<br>接收：${esc(fmt(record.received_at))}</div><div>${esc(record.value?.field||record.category)}：${esc(typeof record.value?.value==='object'?JSON.stringify(record.value.value):record.value?.value)}</div></div>`).join('')}</div>`}
function photoRecords(records){return `<div class="photos">${records.map(record=>`<div class="photo"><a href="${esc(record.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(record.url)}" alt="设备照片"></a><div>${esc(record.width)} × ${esc(record.height)} · ${(Number(record.size_bytes)/1024).toFixed(1)} KB<br>${esc(record.measured_at)}</div></div>`).join('')}</div>`}
function categoryHtml(category){const content=category.id==='photo'?photoRecords(category.records||[]):normalRecords(category.records||[]);const more=category.has_more?`<div style="margin-top:10px"><button class="btn btn-sm" onclick="loadMoreCategory('${esc(category.id)}')">加载更多</button> <span class="muted">已显示 ${category.records.length} / ${category.count}</span></div>`:'';return `<section class="category"><div class="category-head"><h3>${esc(category.label)}（${Number(category.count||0)}）</h3><button class="btn btn-danger btn-sm" onclick="deleteCategory('${esc(category.id)}')">删除这一类</button></div>${content}${more}</section>`}
async function openPacket(id){try{const result=await api(`/1/api/devices/database/packets/${encodeURIComponent(id)}`);selectedPacket=result.packet;document.getElementById('detail').style.display='block';document.getElementById('detail-title').textContent=selectedPacket.device_name;document.getElementById('detail-meta').textContent=`设备 ID：${selectedPacket.device_id} · 数据包：${selectedPacket.packet_id}${selectedPacket.device_deleted_at?' · 原设备已删除':''}`;document.getElementById('categories').innerHTML=(selectedPacket.categories||[]).map(categoryHtml).join('')||'<p class="muted">该数据包暂无数据</p>';window.scrollTo({top:document.getElementById('detail').offsetTop,behavior:'smooth'})}catch(error){alert(`加载失败：${error.message}`)}}
async function deleteCategory(category){if(!selectedPacket||!confirm(`确定删除“${category}”这一类的全部数据？照片文件也会同时删除。`))return;await api(`/1/api/devices/database/packets/${encodeURIComponent(selectedPacket.packet_id)}/categories/${encodeURIComponent(category)}`,{method:'DELETE'});await loadPackets();await openPacket(selectedPacket.packet_id)}
async function loadMoreCategory(categoryId){if(!selectedPacket)return;const category=selectedPacket.categories.find(item=>item.id===categoryId);if(!category)return;const result=await api(`/1/api/devices/database/packets/${encodeURIComponent(selectedPacket.packet_id)}/categories/${encodeURIComponent(categoryId)}?limit=100&offset=${category.records.length}`);category.records.push(...(result.records||[]));category.has_more=result.has_more;document.getElementById('categories').innerHTML=selectedPacket.categories.map(categoryHtml).join('')}
document.getElementById('delete-packet').onclick=async()=>{if(!selectedPacket)return;const activeNote=selectedPacket.device_deleted_at?'':'\n该设备仍在使用，下次上报时会重新建立空数据包。';if(!confirm(`确定删除整个设备数据包？其中的所有记录和照片文件都会永久删除。${activeNote}`))return;await api(`/1/api/devices/database/packets/${encodeURIComponent(selectedPacket.packet_id)}`,{method:'DELETE'});selectedPacket=null;document.getElementById('detail').style.display='none';await loadPackets()};
document.getElementById('refresh').onclick=loadPackets;loadPackets();
</script></body></html>
