server:
  port: 8081

spring:
  application:
    name: email-service

mail:
  provider: ${MAIL_PROVIDER:imap-smtp}
  account:
    address: ${MAIL_ADDRESS:your_email@example.com}
    username: ${MAIL_USERNAME:your_email@example.com}
    password: ${MAIL_PASSWORD:your_app_password}
  imap:
    host: ${MAIL_IMAP_HOST:outlook.office365.com}
    port: ${MAIL_IMAP_PORT:993}
    ssl: ${MAIL_IMAP_SSL:true}
    folder: ${MAIL_IMAP_FOLDER:INBOX}
  smtp:
    host: ${MAIL_SMTP_HOST:smtp-mail.outlook.com}
    port: ${MAIL_SMTP_PORT:587}
    ssl: ${MAIL_SMTP_SSL:false}
    starttls: ${MAIL_SMTP_STARTTLS:true}
    auth-mechanisms: ${MAIL_SMTP_AUTH_MECHANISMS:LOGIN}
  receiver:
    enabled: ${MAIL_RECEIVER_ENABLED:true}

logging:
  level:
    com.bbdwz.emailservice: INFO
