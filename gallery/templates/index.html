<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="page-gallery">
    <main class="gallery">
      <header class="gallery-hero">
        <div>
          <p class="eyebrow">Bird Photo Journal</p>
          <h1>Gallery</h1>
          <p class="hero-subtitle">按物种归档的日常观鸟影像。</p>
        </div>
        <div class="hero-actions">
          <div class="hero-stats">
            <span>{{ photo_count }} 张照片</span>
            <span>{{ species_count }} 个物种</span>
          </div>
          <a class="enter-link" href="/1/">进入后台</a>
        </div>
      </header>

      {% if groups %}
        <section class="gallery-grid" data-gallery>
          {% for group in groups %}
            <article class="species-group" data-group>
              <button class="stack-card" type="button" data-group-toggle>
                <div class="stack-photos">
                  {% for photo in group.stack_photos %}
                    <img
                      src="{{ photo.thumb_url }}"
                      data-full-src="{{ photo.url }}"
                      alt="{{ group.species }}"
                      loading="lazy"
                      decoding="async"
                    />
                  {% endfor %}
                </div>
              </button>
              <div class="stack-label">
                <p class="photo-species">{{ group.species }}</p>
                <p class="photo-name">{{ group.count }} 张照片</p>
              </div>
              <template data-group-grid>
                {% for photo in group.photos %}
                  <button class="photo-card" type="button" data-full="{{ photo.url }}">
                    <div class="photo-frame">
                      <img
                        src="{{ photo.thumb_url }}"
                        data-full-src="{{ photo.url }}"
                        alt="{{ group.species }}"
                        loading="lazy"
                        decoding="async"
                      />
                    </div>
                    <div class="photo-meta">
                      <p class="photo-species">{{ group.species }}</p>
                      <p class="photo-name">{{ photo.name }}</p>
                    </div>
                  </button>
                {% endfor %}
              </template>
            </article>
          {% endfor %}
        </section>
      {% else %}
        <section class="empty-state">
          <h2>还没有照片</h2>
          <p>上传你的第一张照片，画廊就会在这里展示。</p>
        </section>
      {% endif %}
    </main>

    <div class="group-modal" data-group-modal hidden>
      <div class="group-modal-inner">
        <button class="group-modal-close" type="button" data-group-close>关闭</button>
        <h2 class="group-modal-title" data-group-title></h2>
        <div class="group-modal-grid" data-group-content></div>
      </div>
    </div>

    <div class="lightbox" data-lightbox hidden>
      <button class="lightbox-close" type="button" data-lightbox-close hidden>关闭</button>
      <img class="lightbox-image" src="" alt="" data-lightbox-image />
      <p class="lightbox-caption" data-lightbox-caption></p>
    </div>
    <div class="focus-loading" data-focus-loading hidden>正在全力加载这张图</div>

    <script>
      const grid = document.querySelector("[data-gallery]");
      const groupModal = document.querySelector("[data-group-modal]");
      const groupTitle = document.querySelector("[data-group-title]");
      const groupContent = document.querySelector("[data-group-content]");
      const groupClose = document.querySelector("[data-group-close]");
      const lightbox = document.querySelector("[data-lightbox]");
      const lightboxImage = document.querySelector("[data-lightbox-image]");
      const lightboxCaption = document.querySelector("[data-lightbox-caption]");
      const closeBtn = document.querySelector("[data-lightbox-close]");
      const focusLoading = document.querySelector("[data-focus-loading]");
      const groupModalInner = groupModal.querySelector(".group-modal-inner");
      let pauseHighRes = false;
      let lightboxRequestId = 0;

      const closeGroupModal = () => {
        cancelBackgroundLoads();
        groupModal.hidden = true;
        groupContent.innerHTML = "";
        document.body.classList.remove("no-scroll");
        scheduleVisibleLoad();
      };

      const closeLightbox = () => {
        lightboxRequestId += 1;
        lightboxImage.src = "";
        lightbox.hidden = true;
        closeBtn.hidden = true;
        document.body.classList.toggle("no-scroll", !groupModal.hidden);
        focusLoading.hidden = true;
        pauseHighRes = false;
        scheduleVisibleLoad();
      };

      if (grid) {
        grid.addEventListener("click", (event) => {
          const toggle = event.target.closest("[data-group-toggle]");
          if (toggle) {
            const group = toggle.closest("[data-group]");
            const panel = group.querySelector("[data-group-grid]");
            groupTitle.textContent = group.querySelector(".photo-species").textContent;
            groupContent.innerHTML = panel.innerHTML;
            groupModal.hidden = false;
            document.body.classList.add("no-scroll");
            cancelBackgroundLoads();
            scheduleVisibleLoad();
            return;
          }
        });
      }

      document.addEventListener("click", (event) => {
        const card = event.target.closest(".photo-card");
        if (!card) {
          return;
        }
        const img = card.querySelector("img");
        pauseHighRes = true;
        cancelBackgroundLoads();
        focusLoading.hidden = false;
        const requestId = ++lightboxRequestId;
        lightboxImage.fetchPriority = "high";
        lightboxImage.src = card.dataset.full;
        lightboxImage.alt = img.alt;
        lightboxCaption.textContent = img.alt;
        lightbox.hidden = false;
        closeBtn.hidden = false;
        document.body.classList.add("no-scroll");
        const resumeLoads = () => {
          if (requestId !== lightboxRequestId) {
            return;
          }
          pauseHighRes = false;
          focusLoading.hidden = true;
          scheduleVisibleLoad();
        };
        if (lightboxImage.complete) {
          resumeLoads();
        } else {
          lightboxImage.addEventListener("load", resumeLoads, { once: true });
          lightboxImage.addEventListener("error", resumeLoads, { once: true });
        }
      });

      const fullImages = new Map();
      const activeLoads = new Map();
      const maxConcurrentLoads = navigator.connection?.saveData ? 1 : 2;
      const setLoading = (img, loading) => {
        img.classList.toggle("is-loading", loading);
        const frame = img.closest(".photo-frame");
        if (frame) {
          frame.classList.toggle("is-loading", loading);
        }
      };

      const cancelLoad = (img) => {
        const state = fullImages.get(img);
        if (!state || state.status !== "loading") {
          return;
        }
        state.controller.abort();
        state.status = "idle";
        if (activeLoads.get(img) === state) {
          activeLoads.delete(img);
        }
        setLoading(img, false);
      };

      const cancelBackgroundLoads = () => {
        [...activeLoads.keys()].forEach(cancelLoad);
      };

      const loadFull = async (img) => {
        const full = img.dataset.fullSrc;
        const previous = fullImages.get(img);
        if (!full || previous?.status === "loading" || previous?.status === "loaded") {
          return;
        }
        const controller = new AbortController();
        const state = { status: "loading", controller };
        fullImages.set(img, state);
        activeLoads.set(img, state);
        setLoading(img, true);
        try {
          const response = await fetch(full, {
            signal: controller.signal,
            priority: "high",
          });
          if (!response.ok) {
            throw new Error(`图片加载失败：${response.status}`);
          }
          const objectUrl = URL.createObjectURL(await response.blob());
          if (controller.signal.aborted) {
            URL.revokeObjectURL(objectUrl);
            return;
          }
          state.status = "loaded";
          img.addEventListener("load", () => {
            setLoading(img, false);
            URL.revokeObjectURL(objectUrl);
          }, { once: true });
          img.src = objectUrl;
        } catch (error) {
          if (error.name !== "AbortError") {
            state.status = "error";
          }
          if (fullImages.get(img) === state) {
            setLoading(img, false);
          }
        } finally {
          if (activeLoads.get(img) === state) {
            activeLoads.delete(img);
          }
          scheduleVisibleLoad();
        }
      };

      const currentImages = () => groupModal.hidden
        ? [...document.querySelectorAll(".stack-photos [data-full-src]")]
        : [...groupContent.querySelectorAll("[data-full-src]")];

      const isVisible = (img) => {
        const rect = img.getBoundingClientRect();
        if (groupModal.hidden) {
          return rect.bottom > 0 && rect.top < window.innerHeight;
        }
        const bounds = groupModalInner.getBoundingClientRect();
        return rect.bottom > bounds.top && rect.top < bounds.bottom;
      };

      const loadVisibleHighRes = () => {
        if (pauseHighRes) {
          return;
        }
        const visible = currentImages().filter(isVisible);
        const visibleSet = new Set(visible);
        [...activeLoads.keys()].forEach((img) => {
          if (!visibleSet.has(img)) {
            cancelLoad(img);
          }
        });

        const viewportCenter = window.innerHeight / 2;
        visible.sort((a, b) => {
          const aRect = a.getBoundingClientRect();
          const bRect = b.getBoundingClientRect();
          const aDistance = Math.abs((aRect.top + aRect.bottom) / 2 - viewportCenter);
          const bDistance = Math.abs((bRect.top + bRect.bottom) / 2 - viewportCenter);
          return aDistance - bDistance;
        });

        for (const img of visible) {
          if (activeLoads.size >= maxConcurrentLoads) {
            break;
          }
          const state = fullImages.get(img);
          if (!state || state.status === "idle") {
            loadFull(img);
          }
        }
      };

      const scheduleVisibleLoad = () => {
        if (scheduleVisibleLoad.pending) {
          return;
        }
        scheduleVisibleLoad.pending = true;
        requestAnimationFrame(() => {
          scheduleVisibleLoad.pending = false;
          loadVisibleHighRes();
        });
      };

      window.addEventListener("load", scheduleVisibleLoad, { once: true });
      window.addEventListener("scroll", scheduleVisibleLoad, { passive: true });
      window.addEventListener("resize", scheduleVisibleLoad);
      groupModalInner.addEventListener("scroll", scheduleVisibleLoad, { passive: true });

      groupClose.addEventListener("click", closeGroupModal);
      groupModal.addEventListener("click", (event) => {
        if (event.target === groupModal) {
          closeGroupModal();
        }
      });

      closeBtn.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });
    </script>
  </body>
</html>
