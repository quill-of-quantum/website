<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="page-gallery">
    <main class="gallery">
      <header class="gallery-hero">
        <div>
          <p class="eyebrow">Bird Photo Journal</p>
          <h1>Gallery</h1>
          <p class="hero-subtitle">按物种归档的日常观鸟影像。</p>
        </div>
        <div class="hero-actions">
          <div class="hero-stats">
            <span>{{ photo_count }} 张照片</span>
            <span>{{ species_count }} 个物种</span>
          </div>
          <a class="enter-link" href="/1/">进入后台</a>
        </div>
      </header>

      {% if groups %}
        <section class="gallery-grid" data-gallery>
          {% for group in groups %}
            <article class="species-group" data-group>
              <button class="stack-card" type="button" data-group-toggle>
                <div class="stack-photos">
                  {% for photo in group.stack_photos %}
                    <img src="{{ photo.url }}" alt="{{ group.species }}" loading="lazy" />
                  {% endfor %}
                </div>
              </button>
              <div class="stack-label">
                <p class="photo-species">{{ group.species }}</p>
                <p class="photo-name">{{ group.count }} 张照片</p>
              </div>
              <template data-group-grid>
                {% for photo in group.photos %}
                  <button class="photo-card" type="button" data-full="{{ photo.url }}">
                    <div class="photo-frame">
                      <img src="{{ photo.url }}" alt="{{ group.species }}" loading="lazy" />
                    </div>
                    <div class="photo-meta">
                      <p class="photo-species">{{ group.species }}</p>
                      <p class="photo-name">{{ photo.name }}</p>
                    </div>
                  </button>
                {% endfor %}
              </template>
            </article>
          {% endfor %}
        </section>
      {% else %}
        <section class="empty-state">
          <h2>还没有照片</h2>
          <p>上传你的第一张照片，画廊就会在这里展示。</p>
        </section>
      {% endif %}
    </main>

    <div class="group-modal" data-group-modal hidden>
      <div class="group-modal-inner">
        <button class="group-modal-close" type="button" data-group-close>关闭</button>
        <h2 class="group-modal-title" data-group-title></h2>
        <div class="group-modal-grid" data-group-content></div>
      </div>
    </div>

    <div class="lightbox" data-lightbox hidden>
      <button class="lightbox-close" type="button" data-lightbox-close hidden>关闭</button>
      <img class="lightbox-image" src="" alt="" data-lightbox-image />
      <p class="lightbox-caption" data-lightbox-caption></p>
    </div>

    <script>
      const grid = document.querySelector("[data-gallery]");
      const groupModal = document.querySelector("[data-group-modal]");
      const groupTitle = document.querySelector("[data-group-title]");
      const groupContent = document.querySelector("[data-group-content]");
      const groupClose = document.querySelector("[data-group-close]");
      const lightbox = document.querySelector("[data-lightbox]");
      const lightboxImage = document.querySelector("[data-lightbox-image]");
      const lightboxCaption = document.querySelector("[data-lightbox-caption]");
      const closeBtn = document.querySelector("[data-lightbox-close]");

      const closeGroupModal = () => {
        groupModal.hidden = true;
        groupContent.innerHTML = "";
        document.body.classList.remove("no-scroll");
      };

      const closeLightbox = () => {
        lightbox.hidden = true;
        closeBtn.hidden = true;
        document.body.classList.remove("no-scroll");
      };

      if (grid) {
        grid.addEventListener("click", (event) => {
          const toggle = event.target.closest("[data-group-toggle]");
          if (toggle) {
            const group = toggle.closest("[data-group]");
            const panel = group.querySelector("[data-group-grid]");
            groupTitle.textContent = group.querySelector(".photo-species").textContent;
            groupContent.innerHTML = panel.innerHTML;
            groupModal.hidden = false;
            document.body.classList.add("no-scroll");
            return;
          }
        });
      }

      document.addEventListener("click", (event) => {
          const card = event.target.closest(".photo-card");
          if (!card) {
            return;
          }
          const img = card.querySelector("img");
          lightboxImage.src = card.dataset.full;
          lightboxImage.alt = img.alt;
          lightboxCaption.textContent = img.alt;
          lightbox.hidden = false;
          closeBtn.hidden = false;
          document.body.classList.add("no-scroll");
      });

      groupClose.addEventListener("click", closeGroupModal);
      groupModal.addEventListener("click", (event) => {
        if (event.target === groupModal) {
          closeGroupModal();
        }
      });

      closeBtn.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });
    </script>
  </body>
</html>
